<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>橘米 · 妈妈恢复周报编辑器</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&display=swap');

:root {
  --bg: #F5EDE3;
  --editor-bg: #EBE3D7;
  --card: #FDFBF7;
  --warm: #EDE5D8;
  --warm2: #DDD5C8;
  --text: #5C4F3D;
  --text2: #7A6E5B;
  --text3: #A99E8E;
  --pink: #D4A8A2;
  --pink2: #C28F89;
  --green: #8FAF8B;
  --green2: #7A9E76;
  --blue: #8FAAB8;
  --blue2: #7A96A5;
  --lavender: #B8ADC9;
  --amber: #C4A862;
  --rose: #C28F89;
  --paper: #F5EDE3;
  --tape: rgba(196,168,130,0.35);
  --shadow: 0 2px 12px rgba(92,79,61,0.08);
}

*{margin:0;padding:0;box-sizing:border-box;}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: var(--editor-bg);
  color: var(--text);
  line-height: 1.7;
  height: 100vh;
  overflow: hidden;
}

/* ===== 整体布局 ===== */
.app-layout {
  display: flex;
  height: 100vh;
}

/* ===== 左侧编辑面板 ===== */
.editor-panel {
  width: 380px;
  min-width: 380px;
  background: var(--editor-bg);
  border-right: 1px solid var(--warm2);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  height: 100vh;
}

/* 表单导航 */
.form-nav {
  display: flex;
  gap: 6px;
  padding: 12px 20px;
  background: var(--editor-bg);
  border-bottom: 1px solid var(--warm2);
  position: sticky;
  top: 0;
  z-index: 10;
  flex-shrink: 0;
}

.form-nav button {
  padding: 6px 10px;
  border: 1px solid var(--warm2);
  border-radius: 8px;
  background: var(--card);
  font-size: 12px;
  color: var(--text2);
  cursor: pointer;
  font-family: inherit;
  transition: all 0.2s;
  white-space: nowrap;
}

.form-nav button:hover {
  border-color: var(--amber);
  color: var(--amber);
  background: #FFFDF8;
}

/* 表单滚动容器 */
.form-scroll-container {
  flex: 1;
  overflow-y: auto;
  padding: 0 20px 40px;
}

.form-scroll-container::-webkit-scrollbar { width: 6px; }
.form-scroll-container::-webkit-scrollbar-track { background: transparent; }
.form-scroll-container::-webkit-scrollbar-thumb { background: var(--warm2); border-radius: 3px; }

/* 旧编辑器标题区 */
.editor-header-old {
  padding: 16px 0 12px;
  border-bottom: 1px solid var(--warm2);
  margin-bottom: 16px;
}

.editor-title {
  font-size: 17px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 2px;
}

.editor-subtitle {
  font-size: 12px;
  color: var(--text3);
}

.editor-actions {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.editor-actions button {
  flex: 1;
  border: none;
  border-radius: 8px;
  padding: 9px 0;
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
  font-weight: 500;
  transition: all 0.2s;
}

/* 模板选择器 */
.template-section {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--warm2);
}

.template-label {
  font-size: 12px;
  color: var(--text3);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.template-status {
  font-size: 10px;
  padding: 1px 8px;
  border-radius: 10px;
  font-weight: 500;
}
.template-status.active { background: #E8F5E9; color: var(--green2); }
.template-status.modified { background: #FFF3E0; color: #E6A817; }
.reset-template-btn {
  font-size: 10px;
  color: var(--pink2);
  cursor: pointer;
  text-decoration: underline;
  margin-left: auto;
}
.reset-template-btn:hover { color: var(--rose); }

/* 症状组合器 */
.symptom-builder {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.symptom-row {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.symptom-label {
  font-size: 11px;
  color: var(--text2);
  font-weight: 500;
}

.symptom-options {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}

.symptom-pill {
  padding: 5px 10px;
  border: 1px solid var(--warm2);
  border-radius: 14px;
  background: var(--card);
  cursor: pointer;
  font-family: inherit;
  font-size: 11px;
  color: var(--text2);
  transition: all 0.15s;
  white-space: nowrap;
}

.symptom-pill:hover {
  border-color: var(--amber);
  background: #FFFDF8;
}

.symptom-pill.selected {
  background: var(--amber);
  color: #fff;
  border-color: var(--amber);
  font-weight: 500;
}

.symptom-pill.selected:hover {
  background: #B8963D;
}

.btn-generate {
  width: 100%;
  padding: 10px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--green), var(--green2));
  color: #fff;
  font-size: 13px;
  font-family: inherit;
  font-weight: 600;
  cursor: pointer;
  margin-top: 6px;
  transition: opacity 0.2s;
}

.btn-generate:hover { opacity: 0.9; }

/* 快速模板按钮（保留常用） */
.quick-templates {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-bottom: 10px;
}

.quick-tpl-btn {
  padding: 5px 10px;
  border: 1px dashed var(--warm2);
  border-radius: 8px;
  background: transparent;
  cursor: pointer;
  font-family: inherit;
  font-size: 11px;
  color: var(--text3);
  transition: all 0.15s;
}

.quick-tpl-btn:hover {
  border-color: var(--amber);
  color: var(--text);
  background: #FFFDF8;
}

.btn-preview {
  background: var(--green2);
  color: #fff;
}
.btn-preview:hover { background: #6B8E68; }

.btn-screenshot {
  background: var(--pink2);
  color: #fff;
}
.btn-screenshot:hover { background: #B07A75; }

.btn-download {
  background: var(--amber);
  color: #fff;
}
.btn-download:hover { background: #C49538; }

.form-section {
  margin-top: 20px;
}

.form-section-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  padding-bottom: 8px;
  border-bottom: 1px solid var(--warm2);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.form-section-title .emoji { font-size: 15px; }

.form-row {
  margin-bottom: 12px;
}

/* 紧凑表单行 - 客户信息区使用 */
.form-row.compact {
  margin-bottom: 8px;
}

/* 客户信息网格 - 双列紧凑布局 */
.client-info-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0 12px;
}

.form-row.half {
  display: inline-block;
  width: calc(50% - 6px);
  margin-right: 6px;
}

.form-row.half:nth-child(even) {
  margin-right: 0;
  margin-left: 6px;
}

.form-label {
  font-size: 12px;
  color: var(--text2);
  margin-bottom: 4px;
  display: block;
}

.form-input, .form-select, .form-textarea {
  width: 100%;
  border: 1px solid var(--warm2);
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 13px;
  color: var(--text);
  background: var(--card);
  font-family: inherit;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.form-input:focus, .form-select:focus, .form-textarea:focus {
  outline: none;
  border-color: var(--amber);
  box-shadow: 0 0 0 3px rgba(196,168,130,0.12);
}

.form-textarea {
  resize: vertical;
  min-height: 60px;
  line-height: 1.6;
}

.form-hint {
  font-size: 11px;
  color: var(--text3);
  margin-top: 3px;
}

/* ===== 右侧预览面板 ===== */
.preview-panel {
  flex: 1;
  background: var(--bg);
  overflow-y: auto;
  display: flex;
  justify-content: center;
  padding: 30px 20px 60px;
}

.preview-panel::-webkit-scrollbar { width: 6px; }
.preview-panel::-webkit-scrollbar-track { background: transparent; }
.preview-panel::-webkit-scrollbar-thumb { background: var(--warm2); border-radius: 3px; }

.letter {
  width: 100%;
  max-width: 420px;
  min-height: 100vh;
  background: var(--bg);
  border-radius: 16px;
  padding: 28px 22px;
}

/* ===== 信件样式（统一字体层级） ===== */
/* 信封顶部 */
.envelope { text-align: center; padding: 20px 0 24px; position: relative; }
.envelope-header {
  display: flex; align-items: center; justify-content: center;
  gap: 10px;
  margin: 0 auto 12px;
}
.envelope-seal {
  width: 36px; height: 36px; border-radius: 50%;
  background: linear-gradient(135deg, var(--pink2), var(--rose));
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 2px 6px rgba(194,143,137,0.25);
}
.envelope-seal svg {
  width: 18px; height: 18px;
}
.envelope-lady {
  width: 36px; height: 36px;
  flex-shrink: 0;
}
.envelope-lady img {
  width: 100%; height: 100%; object-fit: contain;
}
.envelope-brand {
  font-size: 11px; letter-spacing: 5px; color: var(--text2); margin-bottom: 8px; font-weight: 500;
}
.envelope-line {
  width: 56px; height: 2px;
  background: linear-gradient(90deg, transparent, var(--amber), transparent);
  margin: 0 auto 10px;
}
.envelope-date {
  font-size: 12px; color: var(--text3); letter-spacing: 0.5px;
}
.envelope-sub {
  font-size: 11px; color: var(--text3); margin-top: 6px; font-style: italic;
}
/* 出所提醒卡片 */
.checkout-reminder {
  margin: 16px 0;
  background: var(--card);
  border-radius: 14px; padding: 14px 16px;
  border: 1px dashed var(--amber);
  position: relative;
}
.checkout-reminder-icon {
  font-size: 16px; margin-right: 6px;
}
.checkout-reminder-title {
  font-size: 13px; font-weight: 600; color: var(--amber); margin-bottom: 4px;
  display: flex; align-items: center;
}
.checkout-reminder-body {
  font-size: 12px; color: var(--text2); line-height: 1.7;
}

/* 称呼 —— 唯一用装饰字体的地方 */
.salutation { padding: 12px 0 8px; }
.salutation-text {
  font-family: 'ZCOOL XiaoWei', serif;
  font-size: 20px; color: var(--text); letter-spacing: 1px;
}
.salutation-sub {
  font-size: 12px; color: var(--text3); margin-top: 4px;
}

/* 情绪确认卡 —— 轻量便签风 */
.affirmation {
  background: var(--paper); border-radius: 16px; padding: 18px 16px;
  margin: 16px 0; position: relative;
  box-shadow: 0 2px 8px rgba(92,79,61,0.06);
  border: 1px solid #F0E8DD;
}
.affirmation::before {
  content: '✦'; position: absolute; top: -8px; left: 24px;
  width: 24px; height: 24px; background: var(--card);
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 10px; color: var(--amber); border: 2px solid var(--warm2);
  box-shadow: 0 1px 4px rgba(92,79,61,0.08);
}
.affirmation-text {
  font-size: 14px; color: var(--text); line-height: 1.9; text-align: left;
  padding-top: 2px;
}
.affirmation-text .highlight { color: var(--pink2); font-weight: 600; }
.affirmation-sign {
  font-size: 11px; color: var(--text3); text-align: right; margin-top: 8px; font-style: italic;
}

/* 段落标签 */
.section { margin: 22px 0 16px; }
.section-tag {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10px; letter-spacing: 1.5px;
  color: var(--text3); background: var(--warm); padding: 3px 10px;
  border-radius: 10px; margin-bottom: 10px;
}
.section-title {
  font-size: 15px; font-weight: 600; color: var(--text);
  margin-bottom: 12px; line-height: 1.5;
  display: flex; align-items: center; gap: 8px;
}
.section-title .hand {
  font-family: 'ZCOOL XiaoWei', serif; font-size: 16px;
}
.section-title .section-emoji {
  font-size: 16px; opacity: 0.7;
}

/* 变化卡片 */
.change-list { display: flex; flex-direction: column; gap: 12px; }
.change-card {
  background: var(--card); border-radius: 14px; padding: 16px 14px;
  position: relative;
  border: 1px solid var(--warm2);
}
.change-sticker { position: absolute; top: 10px; right: 10px; font-size: 16px; opacity: 0.5; }
.change-label { font-size: 11px; color: var(--text3); margin-bottom: 4px; letter-spacing: 0.5px; }
.change-text {
  font-size: 14px; color: var(--text); line-height: 1.7;
}
/* 统一数字样式 —— 不用装饰字体，用weight和color区分 */
.change-text .num {
  font-size: 16px; font-weight: 700; color: var(--pink2);
}
.change-text .num-green { font-size: 16px; font-weight: 700; color: var(--green2); }
.change-text .num-blue { font-size: 16px; font-weight: 700; color: var(--blue2); }
.change-detail { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.6; }
.change-compare { font-size: 11px; color: var(--text3); margin-top: 3px; font-style: italic; }

/* 分隔 */
.divider { text-align: center; padding: 4px 0; }
.divider-dots { font-size: 7px; color: var(--text3); letter-spacing: 5px; }

/* 小知识卡片 */
.knowledge-section { margin: 18px 0; }
.knowledge-title {
  font-size: 13px; font-weight: 600; color: var(--text);
  margin-bottom: 10px; display: flex; align-items: center; gap: 6px;
}
.knowledge-title .section-emoji { font-size: 15px; opacity: 0.7; }
.knowledge-list { display: flex; flex-direction: column; gap: 8px; }
.knowledge-card {
  background: var(--card); border-radius: 12px; padding: 12px 14px;
  position: relative;
  border: 1px solid var(--warm2);
}
.knowledge-card-header {
  display: flex; align-items: center; gap: 6px; margin-bottom: 6px;
}
.knowledge-card-icon {
  width: 24px; height: 24px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; flex-shrink: 0;
}
.knowledge-card-icon.k-pink { background: #FCE4EC; }
.knowledge-card-icon.k-blue { background: #E3F2FD; }
.knowledge-card-icon.k-green { background: #E8F5E9; }
.knowledge-card-icon.k-lavender { background: #F3E5F5; }
.knowledge-card-topic {
  font-size: 12px; font-weight: 600; color: var(--text);
}
.knowledge-card-body {
  font-size: 12px; color: var(--text2); line-height: 1.7;
}
.knowledge-card-body strong {
  color: var(--text); font-weight: 600;
}
.knowledge-card-stats {
  margin-top: 6px; font-size: 11px; color: var(--amber);
  font-weight: 500; font-style: italic;
}

/* 医生卡片 */
.doctor-section { margin: 16px 0; }
.doctor-note {
  background: var(--card);
  border-radius: 14px; padding: 16px 14px;
  border: 1px solid var(--warm2);
}
.doctor-from { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.doctor-avatar {
  width: 32px; height: 32px; border-radius: 50%; background: var(--green);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 12px; font-weight: 600;
}
.doctor-info .d-name { font-size: 13px; font-weight: 600; color: var(--text); }
.doctor-info .d-role { font-size: 11px; color: var(--text3); }
.doctor-words { font-size: 13.5px; color: var(--text); line-height: 1.9; }

/* 建议列表 */
.advice-section { margin-top: 14px; }
.advice-header {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 10px; padding-bottom: 8px;
  border-bottom: 1px dashed var(--warm2);
}
.advice-header-icon { font-size: 16px; }
.advice-header-text { font-size: 13px; font-weight: 600; color: var(--text); flex: 1; }
.advice-header-count {
  font-size: 10px; color: #fff; background: var(--pink2);
  padding: 2px 8px; border-radius: 10px;
}
.advice-intro { font-size: 12.5px; color: var(--text2); margin-bottom: 10px; line-height: 1.7; }
.advice-more {
  text-align: center; font-size: 11px; color: var(--text3); padding: 8px;
  cursor: pointer; border-radius: 8px; background: var(--warm);
  transition: background 0.2s;
}
.advice-more:hover { background: var(--warm2); }

/* ===== 排版方式A：横向卡片（默认） ===== */
.advice-list { display: flex; flex-direction: column; gap: 8px; }
.advice-card {
  background: var(--card); border-radius: 12px; padding: 12px;
  position: relative; overflow: hidden;
  border: 1px solid var(--warm2);
  display: flex; align-items: flex-start; gap: 10px;
}
.advice-card::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 2px; }
.advice-card.a-green::after { background: var(--green); }
.advice-card.a-pink::after { background: var(--pink2); }
.advice-card.a-blue::after { background: var(--blue2); }
.advice-card.a-lavender::after { background: var(--lavender); }
.advice-icon {
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; flex-shrink: 0; margin-top: 2px;
}
.advice-icon.i-green { background: #E8F5E9; }
.advice-icon.i-pink { background: #FCE4EC; }
.advice-icon.i-blue { background: #E3F2FD; }
.advice-icon.i-lavender { background: #F3E5F5; }
.advice-body { flex: 1; min-width: 0; }
.advice-why { font-size: 11.5px; color: var(--text2); line-height: 1.5; margin-bottom: 3px; }
.advice-what { font-size: 13.5px; font-weight: 600; color: var(--text); }
.advice-effect { font-size: 11.5px; color: var(--text2); margin-top: 2px; }
.advice-price { font-size: 10.5px; color: var(--text3); margin-top: 4px; }
.advice-source { font-size: 9px; color: var(--text3); background: var(--warm); padding: 1px 5px; border-radius: 4px; display: inline-block; margin-top: 3px; }

/* ===== 排版方式B：竖向便签（紧凑版） ===== */
.letter.layout-b .advice-list { display: flex; flex-direction: column; gap: 6px; }
.letter.layout-b .advice-card {
  display: block;
  padding: 10px 12px;
  border-left: 3px solid transparent;
  border-radius: 10px;
}
.letter.layout-b .advice-card.a-green { border-left-color: var(--green); }
.letter.layout-b .advice-card.a-pink { border-left-color: var(--pink2); }
.letter.layout-b .advice-card.a-blue { border-left-color: var(--blue2); }
.letter.layout-b .advice-card.a-lavender { border-left-color: var(--lavender); }
.letter.layout-b .advice-card::after { display: none; }
.letter.layout-b .advice-icon {
  display: inline-flex;
  width: 22px; height: 22px;
  font-size: 11px;
  vertical-align: middle;
  margin: 0 4px 0 0;
}
.letter.layout-b .advice-body { display: inline; }
.letter.layout-b .advice-why,
.letter.layout-b .advice-effect,
.letter.layout-b .advice-source { display: none; }
.letter.layout-b .advice-what {
  display: inline;
  font-size: 13px;
  font-weight: 600;
}
.letter.layout-b .advice-price {
  display: inline;
  font-size: 11px;
  margin-left: 6px;
}
.letter.layout-b .advice-price::before { content: ' · '; color: var(--text3); font-weight: 400; }

/* ===== 排版方式C：两列网格 ===== */
.letter.layout-c .advice-list {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.letter.layout-c .advice-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 14px 10px;
  gap: 6px;
}
.letter.layout-c .advice-icon {
  width: 40px; height: 40px;
  font-size: 18px;
  margin: 0;
}
.letter.layout-c .advice-body { width: 100%; }
.letter.layout-c .advice-why { font-size: 10px; line-height: 1.4; }
.letter.layout-c .advice-what { font-size: 12px; }
.letter.layout-c .advice-effect { font-size: 10px; }
.letter.layout-c .advice-price { font-size: 10px; margin-top: 2px; }
.letter.layout-c .advice-source { display: none; }

/* 待办事项 */
.todo-section { margin: 16px 0; }
.todo-list { display: flex; flex-direction: column; gap: 0; }
.todo-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 12px 0; border-bottom: 1px dashed var(--warm2);
}
.todo-item:last-child { border-bottom: none; }
.todo-num {
  width: 24px; height: 24px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: #fff; flex-shrink: 0; margin-top: 1px;
}
.todo-num.n1 { background: var(--pink2); }
.todo-num.n2 { background: var(--green2); }
.todo-num.n3 { background: var(--blue2); }
.todo-action { font-size: 13.5px; color: var(--text); font-weight: 500; line-height: 1.5; }
.todo-desc { font-size: 12px; color: var(--text2); margin-top: 1px; line-height: 1.5; }

/* 产康师手记 */
.personal-note-section { margin: 16px 0; }
.personal-note-card {
  background: var(--card);
  border-radius: 14px; padding: 14px 12px;
  border: 1px dashed var(--amber);
  position: relative;
}
.personal-note-card::before {
  content: '✎'; position: absolute; top: -8px; left: 20px;
  width: 24px; height: 24px; background: var(--card);
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 10px; color: var(--amber); border: 2px solid var(--warm2);
  box-shadow: 0 1px 4px rgba(92,79,61,0.08);
}
.personal-note-title { font-size: 12.5px; color: var(--amber); margin-bottom: 8px; padding-top: 2px; }
.personal-note-body { font-size: 13.5px; color: var(--text); line-height: 1.9; }

/* 联系卡片 */
.contact-section { margin: 20px 0 0; }
.contact-card {
  background: var(--card); border-radius: 14px; padding: 14px 12px;
  border: 1px solid var(--warm2); position: relative; overflow: hidden;
}
.contact-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2.5px;
  background: linear-gradient(90deg, var(--pink2), var(--green2), var(--blue2));
}
.contact-title { font-size: 12.5px; color: var(--text); font-weight: 600; margin-bottom: 10px; text-align: center; }
.contact-consultant { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.contact-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: linear-gradient(135deg, var(--pink2), var(--rose));
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 14px; font-weight: 600; flex-shrink: 0;
}
.contact-name { font-size: 13px; font-weight: 600; color: var(--text); }
.contact-role { font-size: 11px; color: var(--text3); }
.contact-methods { display: flex; flex-direction: column; gap: 6px; }
.contact-method {
  display: flex; align-items: center; gap: 8px;
  background: var(--warm); border-radius: 8px; padding: 8px 10px;
}
.contact-label { font-size: 10px; color: var(--text3); }
.contact-value { font-size: 12px; color: var(--text); font-weight: 500; }
.contact-hint { font-size: 10.5px; color: var(--text3); text-align: center; margin-top: 8px; font-style: italic; }

/* 信尾 */
.sign-off { margin: 18px 0 6px; text-align: right; padding-right: 4px; }
.sign-words { font-family: 'ZCOOL XiaoWei', serif; font-size: 14px; color: var(--text); line-height: 1.6; }
.sign-brand { font-size: 11px; color: var(--text2); margin-top: 1px; }
.sign-slogan { font-size: 10px; color: var(--text3); margin-top: 0; font-style: italic; }

/* 底部 */
.footer { text-align: left; padding: 10px 0 4px; }
.footer-line { width: 100%; height: 0.5px; background: var(--warm2); margin: 0 0 8px; }
.footer-note { font-size: 9.5px; color: var(--text3); line-height: 1.6; }

/* ===== 截图模式：隐藏编辑面板 ===== */
body.screenshot-mode .editor-panel { display: none; }
body.screenshot-mode .preview-panel {
  padding: 0;
  justify-content: center;
  align-items: flex-start;
  background: var(--bg);
}
body.screenshot-mode .letter {
  max-width: 420px;
  min-height: 100vh;
  border-radius: 0;
  box-shadow: none;
}

/* ===== 悬浮返回按钮（截图/全屏模式可见） ===== */
.back-to-edit-btn {
  display: none;
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 9999;
  background: rgba(92, 79, 61, 0.6);
  color: #FFF;
  border: none;
  border-radius: 20px;
  padding: 8px 16px;
  font-size: 12px;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  transition: all 0.25s;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  opacity: 0.3;
  transform: scale(0.85);
  transform-origin: left center;
}
.back-to-edit-btn:hover {
  background: rgba(92, 79, 61, 0.9);
  opacity: 1;
  transform: scale(1);
  box-shadow: 0 3px 12px rgba(0,0,0,0.2);
}
body.screenshot-mode .back-to-edit-btn {
  display: flex;
  align-items: center;
  gap: 6px;
}
}

/* ===== 移动端适配 ===== */
@media (max-width: 768px) {
  .app-layout { flex-direction: column; }
  .editor-panel {
    width: 100%;
    min-width: 100%;
    height: 50vh;
  }
  .form-scroll-container {
    max-height: 45vh;
  }
  .client-info-grid {
    grid-template-columns: 1fr;
  }
}

/* ===== 推荐方案调整区 ===== */
.rec-summary {
  display: flex; flex-wrap: wrap; gap: 4px;
  margin-top: 4px;
}
.rec-tag {
  font-size: 10px; padding: 2px 8px; border-radius: 10px;
  background: var(--warm); color: var(--text2);
}
.rec-tag.auto { background: #E8F5E9; color: var(--green2); }
.rec-tag.manual { background: #FFF3E0; color: #E6A817; }
.rec-add-row {
  display: flex; gap: 6px; align-items: center;
}
.rec-add-row .form-input { flex: 1; }
.btn-add-rec {
  padding: 8px 14px; border: none; border-radius: 8px;
  background: var(--amber); color: #fff; font-size: 12px;
  cursor: pointer; font-family: inherit; font-weight: 500;
  white-space: nowrap; transition: background 0.2s;
}
.btn-add-rec:hover { background: #B8963D; }
.rec-manual-list { display: flex; flex-direction: column; gap: 4px; }
.rec-manual-item {
  display: flex; align-items: center; gap: 8px;
  background: #FFF8EE; border: 1px dashed var(--amber);
  border-radius: 8px; padding: 6px 10px; font-size: 12px;
}
.rec-manual-item .rm-name { flex: 1; color: var(--text); font-weight: 500; }
.rec-manual-item .rm-price { color: var(--text3); font-size: 11px; }
.rec-manual-item .rm-del {
  cursor: pointer; color: var(--pink2); font-size: 14px; line-height: 1;
  border: none; background: none; padding: 0 4px;
}
.rec-manual-item .rm-del:hover { color: var(--rose); }

/* 可勾选的自动推荐标签 */
.rec-selectable {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.rec-selectable .rec-tag {
  cursor: pointer;
  user-select: none;
  transition: all 0.15s;
  position: relative;
  padding-left: 22px;
}
.rec-selectable .rec-tag::before {
  content: '✓';
  position: absolute;
  left: 7px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 10px;
  font-weight: 700;
}
.rec-selectable .rec-tag.unchecked {
  background: var(--warm2);
  color: var(--text3);
  opacity: 0.6;
}
.rec-selectable .rec-tag.unchecked::before {
  content: '○';
  font-size: 9px;
  opacity: 0.5;
}
.rec-selectable .rec-tag:hover {
  transform: translateY(-1px);
}
.rec-selectable .rec-tag.unchecked:hover {
  opacity: 0.9;
}

/* 排版切换按钮 */
.layout-toggle {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.layout-btn {
  padding: 6px 12px;
  border: 1px solid var(--warm2);
  border-radius: 10px;
  background: var(--card);
  font-size: 12px;
  color: var(--text2);
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
}
.layout-btn:hover {
  border-color: var(--pink2);
  color: var(--pink2);
}
.layout-btn.active {
  background: var(--pink2);
  color: #fff;
  border-color: var(--pink2);
}

/* 手记话术模板 */
.note-templates {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-bottom: 8px;
}
.note-tpl-btn {
  padding: 5px 10px;
  border: 1px solid var(--warm2);
  border-radius: 12px;
  background: var(--card);
  cursor: pointer;
  font-family: inherit;
  font-size: 11px;
  color: var(--text2);
  transition: all 0.15s;
}
.note-tpl-btn:hover {
  border-color: var(--pink2);
  color: var(--pink2);
  background: #FFF8F6;
}
.note-tpl-btn:active {
  background: var(--pink2);
  color: #fff;
}
</style>
</head>
<body>

<!-- 悬浮返回按钮（截图/全屏模式可见） -->
<button class="back-to-edit-btn" onclick="backToEdit()">← 返回编辑</button>

<div class="app-layout">

<!-- ═══════════════ 左侧编辑面板 ═══════════════ -->
<div class="editor-panel" id="editorPanel">
  <!-- 表单导航 -->
  <div class="form-nav">
    <button onclick="scrollToSection('client-info')">👤 客户信息</button>
    <button onclick="scrollToSection('assessment')">📊 本周评估</button>
    <button onclick="scrollToSection('recommendations')">🎯 推荐方案</button>
    <button onclick="scrollToSection('consultant')">👩⚕️ 顾问信息</button>
  </div>
  
  <div class="form-scroll-container">
    <div class="editor-header-old">
      <div class="editor-title">📋 产康师填写区</div>
      <div class="editor-subtitle">填完右侧自动更新，截图即可发给客户</div>
      <div class="editor-actions">
        <button class="btn-preview" onclick="togglePreview()">📱 全屏预览</button>
        <button class="btn-screenshot" onclick="doScreenshot()">📸 截图模式</button>
        <button class="btn-download" onclick="downloadScreenshot()">💾 一键截图</button>
      </div>
    </div>
    <div class="template-section">
      <div class="template-label">
        🧩 症状组合器
        <span class="template-status active" id="templateStatus">✅ 常见型</span>
        <span class="reset-template-btn" id="resetBtn" onclick="resetTemplate()" style="display:none">↺ 重置</span>
      </div>

      <!-- 常用一键模板 -->
      <div class="quick-templates">
        <button class="quick-tpl-btn" onclick="applyTemplate('mild')">🌿 轻度</button>
        <button class="quick-tpl-btn" onclick="applyTemplate('moderate')">🎀 常见</button>
        <button class="quick-tpl-btn" onclick="applyTemplate('severe')">🩺 重度</button>
        <button class="quick-tpl-btn" onclick="applyTemplate('all_clear')">✨ 恢复良好</button>
      </div>

      <!-- 自由组合 -->
      <div class="symptom-builder">
        <div class="symptom-row">
          <div class="symptom-label">腹直肌分离</div>
          <div class="symptom-options" id="sDiastasis">
            <button class="symptom-pill" data-val="1.5" onclick="selectSymptom(this, 'diastasis')">≤2指正常</button>
            <button class="symptom-pill selected" data-val="2.5" onclick="selectSymptom(this, 'diastasis')">2-3指轻度</button>
            <button class="symptom-pill" data-val="3.5" onclick="selectSymptom(this, 'diastasis')">3-4指中度</button>
            <button class="symptom-pill" data-val="4.5" onclick="selectSymptom(this, 'diastasis')">≥4指重度</button>
          </div>
        </div>
        <div class="symptom-row">
          <div class="symptom-label">盆底肌力</div>
          <div class="symptom-options" id="sPelvic">
            <button class="symptom-pill" data-val="3" onclick="selectSymptom(this, 'pelvic')">≥Ⅲ级达标</button>
            <button class="symptom-pill selected" data-val="2" onclick="selectSymptom(this, 'pelvic')">Ⅱ级轻度</button>
            <button class="symptom-pill" data-val="1" onclick="selectSymptom(this, 'pelvic')">Ⅰ级中度</button>
            <button class="symptom-pill" data-val="0" onclick="selectSymptom(this, 'pelvic')">0级重度</button>
          </div>
        </div>
        <div class="symptom-row">
          <div class="symptom-label">子宫状态</div>
          <div class="symptom-options" id="sUterus">
            <button class="symptom-pill" data-val="已入盆" onclick="selectSymptom(this, 'uterus')">已入盆</button>
            <button class="symptom-pill selected" data-val="未入盆" onclick="selectSymptom(this, 'uterus')">未入盆</button>
          </div>
        </div>
        <div class="symptom-row">
          <div class="symptom-label">会阴状态</div>
          <div class="symptom-options" id="sPerineal">
            <button class="symptom-pill" data-val="已闭合" onclick="selectSymptom(this, 'perineal')">已闭合</button>
            <button class="symptom-pill selected" data-val="未完全闭合" onclick="selectSymptom(this, 'perineal')">未完全闭合</button>
            <button class="symptom-pill" data-val="未闭合" onclick="selectSymptom(this, 'perineal')">未闭合</button>
          </div>
        </div>
        <div class="symptom-row">
          <div class="symptom-label">乳腺状态</div>
          <div class="symptom-options" id="sBreast">
            <button class="symptom-pill selected" data-val="正常" onclick="selectSymptom(this, 'breast')">正常</button>
            <button class="symptom-pill" data-val="不通" onclick="selectSymptom(this, 'breast')">不通需疏通</button>
          </div>
        </div>
        <button class="btn-generate" onclick="generateFromSymptoms()">🎲 按症状生成模板</button>
      </div>
    </div>

    <!-- 客户信息 -->
    <div class="form-section" id="client-info">
      <div class="form-section-title"><span class="emoji">👤</span> 客户信息</div>
      <div class="client-info-grid">
        <div class="form-row compact">
          <label class="form-label">姓名</label>
          <input class="form-input" id="inputName" value="梦梅" placeholder="客户名">
        </div>
        <div class="form-row compact">
          <label class="form-label">分娩方式</label>
          <select class="form-select" id="inputDelivery">
            <option value="顺产" selected>顺产</option>
            <option value="剖宫产">剖宫产</option>
          </select>
        </div>
        <div class="form-row compact">
          <label class="form-label">分娩日期</label>
          <input class="form-input" id="inputBirthDate" type="date" value="2026-05-20">
        </div>
        <div class="form-row compact">
          <label class="form-label">入住日期</label>
          <input class="form-input" id="inputCheckInDate" type="date" value="2026-05-21">
        </div>
        <div class="form-row compact">
          <label class="form-label">离所日期</label>
          <input class="form-input" id="inputCheckOutDate" type="date" value="2026-06-19">
          <div class="form-hint" id="stayHint">28天套餐</div>
        </div>
        <div class="form-row compact">
          <label class="form-label">当前周次（自动）</label>
          <input class="form-input" id="inputWeek" type="number" value="3" style="background:#f8f4ee" readonly>
        </div>
        <div class="form-row compact" style="display:none">
          <label class="form-label">产后天数（自动）</label>
          <input class="form-input" id="inputDays" type="number" value="21">
        </div>
      </div>
      <div class="form-hint" id="dateCalcHint" style="margin-top:4px;font-size:12px;color:var(--amber)">产后第21天 · 在所第20天 / 共28天</div>
    </div>

    <!-- 本周评估 -->
    <div class="form-section" id="assessment">
      <div class="form-section-title"><span class="emoji">📊</span> 本周评估数据</div>
      <div class="client-info-grid">
        <div class="form-row compact">
          <label class="form-label">腹直肌分离（指宽）</label>
          <input class="form-input" id="inputDiastasisF" type="number" step="0.5" value="3" placeholder="如 3">
        </div>
        <div class="form-row compact">
          <label class="form-label">腹直肌（厘米）</label>
          <input class="form-input" id="inputDiastasisCm" type="number" step="0.1" value="2.5" placeholder="如 2.5">
        </div>
        <div class="form-row compact">
          <label class="form-label">子宫状态</label>
          <select class="form-select" id="inputUterus">
            <option value="已入盆">已入盆</option>
            <option value="未入盆" selected>未入盆</option>
          </select>
        </div>
        <div class="form-row compact">
          <label class="form-label">盆底肌力（0-5级）</label>
          <select class="form-select" id="inputPelvic">
            <option value="0">0级</option>
            <option value="1">Ⅰ级</option>
            <option value="2" selected>Ⅱ级</option>
            <option value="3">Ⅲ级</option>
            <option value="4">Ⅳ级</option>
            <option value="5">Ⅴ级</option>
          </select>
        </div>
        <div class="form-row compact" style="grid-column: 1 / -1">
          <label class="form-label">会阴状态</label>
          <select class="form-select" id="inputPerineal">
            <option value="已闭合">已闭合</option>
            <option value="未完全闭合" selected>未完全闭合</option>
            <option value="未闭合">未闭合</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 上周对比 -->
    <div class="form-section">
      <div class="form-section-title"><span class="emoji">📉</span> 上周数据（用于对比）</div>
      <div class="client-info-grid">
        <div class="form-row compact">
          <label class="form-label">上周腹直肌</label>
          <input class="form-input" id="inputLastD" type="number" step="0.5" value="4" placeholder="无对比可不填">
        </div>
        <div class="form-row compact">
          <label class="form-label">上周盆底肌</label>
          <select class="form-select" id="inputLastP">

            <option value="0">0级</option>

            <option value="2">Ⅱ级</option>
            <option value="3">Ⅲ级</option>
          </select>
        </div>
        <div class="form-row compact">
          <label class="form-label">上周子宫</label>
          <select class="form-select" id="inputLastU">
            <option value="已入盆">已入盆</option>
            <option value="未入盆" selected>未入盆</option>
          </select>
        </div>
        <div class="form-row compact">
          <label class="form-label">上周会阴</label>
          <select class="form-select" id="inputLastPerineal">
            <option value="已闭合">已闭合</option>
            <option value="未完全闭合">未完全闭合</option>
            <option value="未闭合" selected>未闭合</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 医生建议 -->
    <div class="form-section">
      <div class="form-section-title"><span class="emoji">🩺</span> 医生建议</div>
      <div class="form-row">
        <label class="form-label">医生姓名</label>
        <input class="form-input" id="inputDoctorName" value="黄医生" placeholder="如 黄医生">
      </div>
      <div class="form-row">
        <label class="form-label">查房建议（原文）</label>
        <textarea class="form-textarea" id="inputDoctorAdvice" placeholder="建议关注盆底肌训练...">建议关注盆底肌训练，产后42天内是黄金恢复期。腹直肌恢复进展良好，子宫复旧需要加强。</textarea>
        <div class="form-hint">系统会自动转述为闺蜜口吻</div>
      </div>
    </div>

    <!-- 推荐方案手动调整 -->
    <div class="form-section" id="recommendations">
      <div class="form-section-title"><span class="emoji">🎯</span> 推荐方案调整（可手动增删）</div>
      <div class="form-row">
        <label class="form-label">信件中推荐方案的排版方式</label>
        <div class="layout-toggle">
          <button class="layout-btn active" data-layout="a" onclick="setLetterLayout('a')">📋 横向卡片</button>
          <button class="layout-btn" data-layout="b" onclick="setLetterLayout('b')">📝 竖向便签</button>
          <button class="layout-btn" data-layout="c" onclick="setLetterLayout('c')">🔲 两列网格</button>

        <div class="form-hint" style="margin-top:4px">横向卡片=信息完整；竖向便签=极简紧凑；两列网格=视觉丰富</div>

      <div class="form-row">

      <div class="form-row">
        <label class="form-label">手动添加推荐项目</label>
        <div class="rec-add-row">
          <input class="form-input" id="manualRecName" placeholder="项目名称，如：盆底肌磁刺激">

      <div class="form-row">
        <div class="rec-manual-list" id="recManualList"></div>
      </div>
      <div class="form-hint" id="recHint">点击上方标签可取消勾选，取消后信件中不再显示该项目</div>

// 读取表单数据
function getFormData() {
  const postpartumDays = parseInt(document.getElementById('inputDays').value) || 1;
  const currentWeek = parseInt(document.getElementById('inputWeek').value) || 1;

  // 计算在所天数
  const checkInDateStr = document.getElementById('inputCheckInDate').value;
  const checkOutDateStr = document.getElementById('inputCheckOutDate').value;
  const today = new Date();
  let stayDays = 0, totalStayDays = 0;
  if (checkInDateStr) {
    const checkIn = new Date(checkInDateStr);
    stayDays = Math.max(1, Math.floor((today - checkIn) / (1000 * 60 * 60 * 24)) + 1);
    if (checkOutDateStr) {
      const checkOut = new Date(checkOutDateStr);
      totalStayDays = Math.max(stayDays, Math.floor((checkOut - checkIn) / (1000 * 60 * 60 * 24)) + 1);
    } else {
      totalStayDays = stayDays;
    }
  }

  // 是否快出所（离所前7天内）
  const nearCheckout = totalStayDays > 0 && stayDays >= totalStayDays - 3;

  // 在所进度百分比
  const stayProgress = totalStayDays > 0 ? Math.min(100, Math.round(stayDays / totalStayDays * 100)) : 0;

  return {
    name: document.getElementById('inputName').value.trim() || '妈妈',
    deliveryType: document.getElementById('inputDelivery').value,
    currentWeek,
    postpartumDays,
    stayDays,
    totalStayDays,
    nearCheckout,
    stayProgress,
    assessment: {
      diastasisFingers: parseFloat(document.getElementById('inputDiastasisF').value) || 0,
      diastasisCm: parseFloat(document.getElementById('inputDiastasisCm').value) || 0,
      uterusPosition: document.getElementById('inputUterus').value,
      pelvicFloorGrade: parseFloat(document.getElementById('inputPelvic').value) || 0,
      perinealClosure: document.getElementById('inputPerineal').value,

function toRoman(num) {
  const map = ['0','Ⅰ','Ⅱ','Ⅲ','Ⅳ','Ⅴ'];
  return map[Math.round(num)] || String(num);
}

function translateDoctorAdvice(advice) {
  let text = advice;
  text = text.replace(/建议关注/g, '我们可以一起关注');
  text = text.replace(/建议配合/g, '可以试试配合');
  text = text.replace(/建议/g, '可以试试');
  text = text.replace(/需加强/g, '可以再努力一下');
  text = text.replace(/需注意/g, '记得留意一下');
  text = text.replace(/进展良好/g, '恢复得不错呢');
  text = text.replace(/黄金恢复期/g, '最关键的恢复时间');
  text = text.replace(/黄金期/g, '最重要的时间');
  return text;
}

function autoRecommend(asmt, days) {
  const recs = [];
  const { diastasisFingers, uterusPosition, pelvicFloorGrade, perinealClosure } = asmt;
  let abnormalCount = 0;

  if (diastasisFingers >= 4) { recs.push({...PRODUCT_MAP.diastasis_severe, fingers: diastasisFingers, _key: 'diastasis'}); abnormalCount++; }
  else if (diastasisFingers > 2) { recs.push({...PRODUCT_MAP.diastasis_moderate, fingers: diastasisFingers, _key: 'diastasis'}); abnormalCount++; }

  if (pelvicFloorGrade < 3) {
    recs.push({...PRODUCT_MAP.pelvic_electro, grade: toRoman(pelvicFloorGrade), _key: 'pelvic'});
    if (pelvicFloorGrade <= 1) recs.push({...PRODUCT_MAP.pelvic_manual, grade: toRoman(pelvicFloorGrade), _key: 'pelvic_extra'});
    abnormalCount++;
  }

  if (perinealClosure !== '已闭合') {
    recs.push({... (perinealClosure === '未闭合' ? PRODUCT_MAP.perineal_inner_rf : PRODUCT_MAP.perineal_rf), _key: 'perineal'});
    abnormalCount++;
  }

  if (uterusPosition === '未入盆') { recs.push({...PRODUCT_MAP.uterus_ultrasound, days, _key: 'uterus'}); abnormalCount++; }

  // 3项以上异常 → 推荐安心卡（套餐）
  if (abnormalCount >= 3) recs.push({...PRODUCT_MAP['安心卡'], _key: 'package'});

  return recs.map(r => ({
    ...r,
    why: r.why ? r.why.replace('{fingers}', asmt.diastasisFingers).replace('{grade}', toRoman(asmt.pelvicFloorGrade)).replace('{days}', days) : '',
    source: '系统推荐',
  }));
}

  if (pelvicFloorGrade < 3) todos.push({ action: '练习凯格尔运动', desc: '每天3组，每组10次收缩，坐着躺着都能做，悄悄变强~' });
  if (diastasisFingers > 2) todos.push({ action: '练习腹式呼吸', desc: '吸气鼓肚子、呼气收肚子，每次5分钟，帮助腹直肌往中间靠' });
  if (perinealClosure !== '已闭合') todos.push({ action: '注意会阴清洁与休息', desc: '勤换卫生巾，避免久坐，给伤口一个安静愈合的环境' });

  if (todos.length === 0) todos.push({ action: '继续保持好心情', desc: '你的各项指标都恢复得不错，休息好、吃好就是最好的恢复' });
  return todos.slice(0, 3);
}

// 模板状态管理
let currentTemplateKey = 'moderate';
let isModified = false;
let manualRecs = []; // 手动添加的推荐项
let disabledAutoRecs = new Set(); // 用户取消勾选的自动推荐key
let currentLetterLayout = 'a'; // 信件排版方式：a=横向卡片, b=竖向便签, c=两列网格

const TEMPLATE_NAMES = {
  mild: '轻度型', moderate: '常见型', severe: '重度型',
  pelvic_only: '盆底型', perineal_only: '会阴型', breast_only: '乳腺型',
  breast_pelvic: '乳腺+盆底型', post_cesarean: '剖宫产型', all_clear: '恢复良好型',
  custom: '自定义组合'
};

function applyTemplate(key) {
  const t = TEMPLATES[key];
  if (!t) return;
  currentTemplateKey = key;
  isModified = false;
  manualRecs = [];
  disabledAutoRecs.clear();

  document.getElementById('inputName').value = t.name;
  document.getElementById('inputDelivery').value = t.deliveryType;
  document.getElementById('inputWeek').value = t.week;
  document.getElementById('inputDays').value = t.days;
  document.getElementById('inputDiastasisF').value = t.assessment.diastasisFingers;
  document.getElementById('inputDiastasisCm').value = t.assessment.diastasisCm;
  document.getElementById('inputUterus').value = t.assessment.uterusPosition;
  document.getElementById('inputPelvic').value = t.assessment.pelvicFloorGrade;
  document.getElementById('inputPerineal').value = t.assessment.perinealClosure;

  if (t.lastWeek.diastasisFingers) document.getElementById('inputLastD').value = t.lastWeek.diastasisFingers;
  if (t.lastWeek.pelvicFloorGrade !== null) document.getElementById('inputLastP').value = t.lastWeek.pelvicFloorGrade;
  if (t.lastWeek.uterusPosition) document.getElementById('inputLastU').value = t.lastWeek.uterusPosition;
  if (t.lastWeek.perinealClosure) document.getElementById('inputLastPerineal').value = t.lastWeek.perinealClosure;

  document.getElementById('inputDoctorName').value = localStorage.getItem('jumi_doctorName') || '黄医生';
  document.getElementById('inputDoctorAdvice').value = t.doctorAdvice;

  // 产康师信息从localStorage读取默认值
  document.getElementById('inputConsultantName').value = localStorage.getItem('jumi_consultantName') || t.consultant.name;
  document.getElementById('inputConsultantPhone').value = localStorage.getItem('jumi_consultantPhone') || t.consultant.phone;
  document.getElementById('inputConsultantWechat').value = localStorage.getItem('jumi_consultantWechat') || t.consultant.wechat;
  document.getElementById('inputConsultantHours').value = localStorage.getItem('jumi_consultantHours') || t.consultant.workingHours;
  document.getElementById('inputPersonalNote').value = t.personalNote;

  // 设置分娩日期（根据天数反推）
  const days = t.days;
  const birthDate = new Date();
  birthDate.setDate(birthDate.getDate() - days);
  document.getElementById('inputBirthDate').value = birthDate.toISOString().split('T')[0];

  // 设置入住日期（分娩日期+1天）
  const checkInDate = new Date(birthDate);
  checkInDate.setDate(checkInDate.getDate() + 1);
  document.getElementById('inputCheckInDate').value = checkInDate.toISOString().split('T')[0];

  // 设置离所日期（入住日期+总天数）
  if (t.totalStayDays) {
    const checkOutDate = new Date(checkInDate);
    checkOutDate.setDate(checkOutDate.getDate() + t.totalStayDays - 1);
    document.getElementById('inputCheckOutDate').value = checkOutDate.toISOString().split('T')[0];
  }

  updateTemplateStatus();
  updateRecSummary();
  calcDaysFromDate(); // 触发日期联动计算
}

function resetTemplate() {
  disabledAutoRecs.clear();
  applyTemplate(currentTemplateKey);
}

function updateTemplateStatus() {
  const status = document.getElementById('templateStatus');
  const resetBtn = document.getElementById('resetBtn');
  if (isModified) {
    status.className = 'template-status modified';
    status.textContent = '✏️ 已修改';
    resetBtn.style.display = 'inline';
  } else {
    status.className = 'template-status active';
    status.textContent = '✅ ' + (TEMPLATE_NAMES[currentTemplateKey] || '');
    resetBtn.style.display = 'none';
  }
}

function markModified() {
  if (!isModified) {
    isModified = true;
    updateTemplateStatus();
  }
}

// 日期自动计算：产后天数、在所天数、周次
function calcDaysFromDate() {
  const birthDateStr = document.getElementById('inputBirthDate').value;
  const checkInDateStr = document.getElementById('inputCheckInDate').value;
  const checkOutDateStr = document.getElementById('inputCheckOutDate').value;

  const today = new Date();

  // 产后天数
  let postpartumDays = 1, currentWeek = 1;
  if (birthDateStr) {
    const birthDate = new Date(birthDateStr);
    postpartumDays = Math.max(1, Math.floor((today - birthDate) / (1000 * 60 * 60 * 24)));
    currentWeek = Math.min(6, Math.max(1, Math.ceil(postpartumDays / 7)));
  }
  document.getElementById('inputDays').value = postpartumDays;
  document.getElementById('inputWeek').value = currentWeek;

  // 在所天数
  let stayDays = 0, totalStayDays = 0;
  if (checkInDateStr) {
    const checkIn = new Date(checkInDateStr);
    stayDays = Math.max(1, Math.floor((today - checkIn) / (1000 * 60 * 60 * 24)) + 1);
    if (checkOutDateStr) {
      const checkOut = new Date(checkOutDateStr);
      totalStayDays = Math.max(stayDays, Math.floor((checkOut - checkIn) / (1000 * 60 * 60 * 24)) + 1);
    }
  }

  // 套餐天数提示
  const stayHint = document.getElementById('stayHint');
  if (totalStayDays > 0) {
    const pkgName = totalStayDays <= 28 ? '28天套餐' : totalStayDays <= 30 ? '30天套餐' : totalStayDays <= 42 ? '42天套餐' : `${totalStayDays}天`;
    stayHint.textContent = pkgName;
  }

  // 日期计算提示
  const dateCalcHint = document.getElementById('dateCalcHint');
  let hint = `产后第${postpartumDays}天 · 第${currentWeek}周`;
  if (stayDays > 0 && totalStayDays > 0) {
    hint = `产后第${postpartumDays}天 · 在所第${stayDays}天 / 共${totalStayDays}天`;
  } else if (stayDays > 0) {
    hint = `产后第${postpartumDays}天 · 在所第${stayDays}天`;
  }
  dateCalcHint.textContent = hint;

  markModified();
  updateRecSummary();
  renderLetter();
}

  priceEl.value = '';

  updateRecSummary();
  renderLetter();

}

function selectSymptom(btn, type) {
  const container = btn.parentElement;
  container.querySelectorAll('.symptom-pill').forEach(p => p.classList.remove('selected'));
  btn.classList.add('selected');
}

function generateFromSymptoms() {
  const diastasisVal = document.querySelector('#sDiastasis .symptom-pill.selected')?.dataset.val || '2.5';
  const pelvicVal = document.querySelector('#sPelvic .symptom-pill.selected')?.dataset.val || '2';
  const uterusVal = document.querySelector('#sUterus .symptom-pill.selected')?.dataset.val || '未入盆';
  const perinealVal = document.querySelector('#sPerineal .symptom-pill.selected')?.dataset.val || '未完全闭合';
  const breastVal = document.querySelector('#sBreast .symptom-pill.selected')?.dataset.val || '正常';

  const d = parseFloat(diastasisVal);
  const p = parseFloat(pelvicVal);

  // 构建医生建议文本
  let adviceParts = [];
  if (d > 2) adviceParts.push(`腹直肌分离${d}指，${d >= 4 ? '建议尽快开始系统修复' : '建议继续观察并配合训练'}`);
  if (p < 3) adviceParts.push(`盆底肌力${toRoman(p)}级，${p <= 1 ? '需加强治疗' : '建议关注训练'}`);
  if (uterusVal === '未入盆') adviceParts.push('子宫复旧偏慢，注意促进收缩');
  if (perinealVal !== '已闭合') adviceParts.push('会阴伤口愈合中，注意清洁');
  if (breastVal === '不通') adviceParts.push('乳腺有堵塞，建议做疏通');

  const doctorAdvice = adviceParts.length > 0
    ? adviceParts.join('。') + '。'
    : '各项指标恢复良好，继续保持当前康复节奏即可。';

  // 构建手记
  // 根据症状自动选手记类型
  let noteType = 'encourage';
  if (breastVal === '不通') noteType = 'breast';
  else if (d <= 2 && p >= 3 && uterusVal === '已入盆' && perinealVal === '已闭合') noteType = 'remind';
  else if (document.getElementById('inputDelivery').value === '剖宫产') noteType = 'cesarean';
  else if (p < 3 && d <= 2) noteType = 'pelvic';
  else if (perinealVal !== '已闭合' && d <= 2 && p >= 3) noteType = 'perineal';

  const name = document.getElementById('inputName').value.trim() || '梦梅';
  const personalNote = NOTE_TEMPLATES[noteType](name);

  // 填充数据
  document.getElementById('inputDiastasisF').value = d;
  document.getElementById('inputDiastasisCm').value = Math.round(d * 0.8 * 10) / 10;
  document.getElementById('inputPelvic').value = p;
  document.getElementById('inputUterus').value = uterusVal;
  document.getElementById('inputPerineal').value = perinealVal;
  document.getElementById('inputDoctorAdvice').value = doctorAdvice;
  document.getElementById('inputPersonalNote').value = personalNote;

  // 设置上周对比（默认比本周差一点）
  document.getElementById('inputLastD').value = Math.min(d + 1, 5.5);
  document.getElementById('inputLastP').value = Math.max(0, p - 1);
  document.getElementById('inputLastU').value = uterusVal === '已入盆' ? '未入盆' : '未入盆';
  document.getElementById('inputLastPerineal').value = perinealVal === '已闭合' ? '未完全闭合' : '未闭合';

  currentTemplateKey = 'custom';
  isModified = false;
  manualRecs = [];
  disabledAutoRecs.clear();
  updateTemplateStatus();
  updateRecSummary();
  renderLetter();
}

  diet: (name) => `${name}妈妈，这周汤水喝得怎么样？别太油腻，清淡点奶水反而更通畅。想吃什么跟我说，我帮你跟厨房打招呼~`,
  partner: (name) => `${name}妈妈，爸爸这周表现怎么样？让他多参与换尿布、拍嗝，你多休息。两个人的默契，从带娃开始培养~`,
  clear: () => '',
};

function setNoteTpl(type) {
  const name = document.getElementById('inputName').value.trim() || '梦梅';
  const tpl = NOTE_TEMPLATES[type];
  if (tpl) {
    document.getElementById('inputPersonalNote').value = tpl(name);
    markModified();
    renderLetter();
  }
}

function updateRecSummary() {
  const cfg = getFormData();
  const autoRecs = autoRecommend(cfg.assessment, cfg.postpartumDays);
  const summary = document.getElementById('recSummary');
  const manualList = document.getElementById('recManualList');

  // 自动推荐摘要（可勾选）
  let tags = autoRecs.map((r, idx) => {
    const isDisabled = disabledAutoRecs.has(r._key);
    return `<span class="rec-tag auto ${isDisabled ? 'unchecked' : ''}" onclick="toggleAutoRec('${r._key}')" title="点击${isDisabled ? '启用' : '取消'}该项目">${r.what}</span>`;
  }).join('');
  tags += manualRecs.map(r => `<span class="rec-tag manual">${r.name}</span>`).join('');
  summary.innerHTML = tags || '<span class="rec-tag">暂无推荐</span>';

  // 手动推荐列表
  manualList.innerHTML = manualRecs.map((r, i) => `
    <div class="rec-manual-item">
      <span class="rm-name">${r.name}</span>
      <span class="rm-price">${r.price ? '¥' + r.price.toLocaleString() : ''}</span>
      <button class="rm-del" onclick="removeManualRec(${i})">×</button>
    </div>
  `).join('');
}

function toggleAutoRec(key) {
  if (disabledAutoRecs.has(key)) {
    disabledAutoRecs.delete(key);
  } else {
    disabledAutoRecs.add(key);
  }
  markModified();
  updateRecSummary();
  renderLetter();
}

// 保存产康师和医生信息到localStorage
function saveDefaults() {
  localStorage.setItem('jumi_doctorName', document.getElementById('inputDoctorName').value);
  localStorage.setItem('jumi_consultantName', document.getElementById('inputConsultantName').value);
  localStorage.setItem('jumi_consultantPhone', document.getElementById('inputConsultantPhone').value);
  localStorage.setItem('jumi_consultantWechat', document.getElementById('inputConsultantWechat').value);
  localStorage.setItem('jumi_consultantHours', document.getElementById('inputConsultantHours').value);
}

function setLetterLayout(layout) {
  currentLetterLayout = layout;
  document.querySelectorAll('.layout-btn').forEach(btn => {

  renderLetter();
}

  else if (cfg.stayProgress <= 80) affIdx = 3;

// 一键截图下载
async function downloadScreenshot() {
  const letter = document.querySelector('.letter');
  if (!letter) return alert('请先生成周报');
  
  // 显示加载提示
  const btn = document.querySelector('.btn-download');
  const origText = btn.textContent;
  btn.textContent = '⏳ 生成中...';
  btn.disabled = true;
  
  try {
    // 先进入截图模式确保干净画面
    const wasScreenshot = document.body.classList.contains('screenshot-mode');
    if (!wasScreenshot) document.body.classList.add('screenshot-mode');
    
    // 等待一帧让样式生效
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    
    const canvas = await html2canvas(letter, {
      scale: 2, // 2x高清
      useCORS: true,
      backgroundColor: null,
      logging: false,
      // 精确裁剪信件内容
      width: letter.scrollWidth,
      height: letter.scrollHeight,
    });
    
    // 恢复模式
    if (!wasScreenshot) document.body.classList.remove('screenshot-mode');
    
    // 生成文件名
    const nameInput = document.getElementById('inputName');
    const name = nameInput ? nameInput.value || '妈妈' : '妈妈';
    const date = new Date().toLocaleDateString('zh-CN', {month:'numeric', day:'numeric'});
    const filename = `橘米周报_${name}_${date}.png`;
    
    // 触发下载
    const link = document.createElement('a');
    link.download = filename;
    link.href = canvas.toDataURL('image/png');
    link.click();
    
    btn.textContent = '✅ 已保存';
    setTimeout(() => { btn.textContent = origText; }, 2000);
  } catch (err) {
    console.error('截图失败:', err);
    alert('截图生成失败，请尝试手动截图（按PrintScreen或Win+Shift+S）');
    btn.textContent = origText;
  }
  btn.disabled = false;
}
