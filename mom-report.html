<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>妈妈恢复周报 - 橘米康复中心</title>
<style>
:root {
  --bg: #F5F0EB;
  --card: #FFFFFF;
  --primary: #C4A882;
  --primary-dark: #A8926E;
  --primary-light: #EDE3D5;
  --green: #8FAF8B;
  --green-light: #E3EDE2;
  --green-bg: #F0F5EF;
  --rose: #C9929B;
  --rose-light: #F0DDE0;
  --rose-bg: #F8F0F1;
  --blue: #8FAAB8;
  --blue-light: #DDE8EE;
  --blue-bg: #EFF4F7;
  --amber: #C4A862;
  --amber-light: #F0EBD5;
  --text: #4A3F35;
  --text-secondary: #7D7167;
  --text-light: #B5A99F;
  --border: #E8DDD3;
  --shadow: 0 2px 16px rgba(74,63,53,0.06);
  --shadow-lg: 0 4px 24px rgba(74,63,53,0.1);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif;
  background:var(--bg);color:var(--text);line-height:1.6;
  -webkit-font-smoothing:antialiased;
  padding-bottom:40px;
}
.report{max-width:440px;margin:0 auto;padding:20px 16px 0;}

/* ===== Header ===== */
.header{text-align:center;padding:16px 0 24px;}
.brand-name{font-size:12px;color:var(--text-light);letter-spacing:6px;margin-bottom:12px;text-transform:uppercase;}
.header-icon{width:48px;height:48px;margin:0 auto 12px;}
.main-title{font-size:24px;font-weight:700;color:var(--text);letter-spacing:2px;margin-bottom:4px;}
.client-info{font-size:13px;color:var(--text-secondary);margin-top:8px;}
.client-info span{margin:0 6px;}

/* ===== Week Ring ===== */
.week-hero{display:flex;flex-direction:column;align-items:center;margin:0 0 24px;}
.week-ring-wrap{position:relative;width:100px;height:100px;margin-bottom:10px;}
.week-ring{width:100px;height:100px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--primary),#D4C4A8);color:#fff;box-shadow:0 4px 20px rgba(196,168,130,0.3);}
.week-ring .label{font-size:11px;opacity:0.85;}
.week-ring .num{font-size:28px;font-weight:700;line-height:1.1;}
.week-ring .unit{font-size:11px;opacity:0.85;}
.week-hero .week-range{font-size:12px;color:var(--text-light);}

/* ===== Score Card ===== */
.score-card{background:var(--card);border-radius:20px;padding:24px;margin-bottom:16px;box-shadow:var(--shadow-lg);position:relative;overflow:hidden;}
.score-card::before{content:'';position:absolute;top:-30px;right:-30px;width:100px;height:100px;border-radius:50%;background:var(--primary-light);opacity:0.5;}
.score-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;position:relative;z-index:1;}
.score-label{font-size:13px;color:var(--text-secondary);}
.score-num-wrap{text-align:right;}
.score-num{font-size:42px;font-weight:800;line-height:1;color:var(--primary-dark);}
.score-num small{font-size:16px;font-weight:400;color:var(--text-light);}
.score-bar-wrap{margin-bottom:12px;position:relative;z-index:1;}
.score-bar{height:8px;border-radius:4px;background:var(--primary-light);overflow:hidden;}
.score-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--green),var(--primary));transition:width 0.3s;}
.score-compare{font-size:12px;color:var(--text-light);text-align:center;position:relative;z-index:1;}

/* ===== Section Card ===== */
.card{background:var(--card);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);}
.section-header{display:flex;align-items:center;gap:8px;margin-bottom:16px;}
.section-header .dot{width:4px;height:16px;border-radius:2px;flex-shrink:0;}
.section-header .dot-brown{background:var(--primary);}
.section-header .dot-green{background:var(--green);}
.section-header .dot-rose{background:var(--rose);}
.section-header .dot-blue{background:var(--blue);}
.section-header .dot-amber{background:var(--amber);}
.section-title{font-size:15px;font-weight:600;}

/* ===== Metric Grid ===== */
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.metric{border-radius:14px;padding:16px;position:relative;overflow:hidden;}
.metric::after{content:'';position:absolute;top:-10px;right:-10px;width:40px;height:40px;border-radius:50%;opacity:0.15;}
.metric-brown{background:var(--primary-light);}
.metric-brown::after{background:var(--primary);}
.metric-green{background:var(--green-light);}
.metric-green::after{background:var(--green);}
.metric-rose{background:var(--rose-light);}
.metric-rose::after{background:var(--rose);}
.metric-blue{background:var(--blue-light);}
.metric-blue::after{background:var(--blue);}
.metric-icon{width:28px;height:28px;margin-bottom:8px;}
.metric-name{font-size:12px;color:var(--text-secondary);margin-bottom:4px;}
.metric-value{font-size:28px;font-weight:700;line-height:1.2;}
.metric-status{font-size:11px;margin-top:6px;display:flex;align-items:center;gap:4px;}
.status-good{color:var(--green);}
.status-warn{color:var(--amber);}
.status-alert{color:var(--rose);}
.metric-target{font-size:10px;color:var(--text-light);margin-top:2px;}

/* ===== Milestone List ===== */
.milestone-list{list-style:none;}
.milestone-item{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);}
.milestone-item:last-child{border-bottom:none;}
.milestone-icon{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.milestone-icon.done{background:var(--green-light);color:var(--green);}
.milestone-icon.progress{background:var(--amber-light);color:var(--amber);}
.milestone-icon.todo{background:#F0ECE8;color:var(--text-light);}
.milestone-icon svg{width:14px;height:14px;}
.milestone-text{flex:1;}
.milestone-label{font-size:13px;color:var(--text);font-weight:500;}
.milestone-desc{font-size:11px;color:var(--text-light);margin-top:1px;}
.milestone-tag{font-size:10px;padding:2px 8px;border-radius:10px;white-space:nowrap;margin-top:2px;}
.tag-done{background:var(--green-light);color:var(--green);}
.tag-progress{background:var(--amber-light);color:var(--amber-dark,#A08030);}
.tag-todo{background:#F0ECE8;color:var(--text-light);}

/* ===== Doctor Card ===== */
.doctor-card{background:var(--green-bg);border:1px solid var(--green-light);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:none;}
.doctor-header{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.doctor-avatar{width:32px;height:32px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;color:#fff;}
.doctor-avatar svg{width:16px;height:16px;}
.doctor-name{font-size:13px;font-weight:600;color:var(--green);}
.doctor-role{font-size:11px;color:var(--text-light);}
.doctor-content{font-size:14px;color:var(--text);line-height:1.8;padding-left:40px;}

/* ===== Trend Chart ===== */
.trend-section{margin-bottom:16px;}
.trend-tabs{display:flex;gap:8px;margin-bottom:12px;}
.trend-tab{font-size:11px;padding:4px 12px;border-radius:12px;background:var(--card);color:var(--text-secondary);border:1px solid var(--border);cursor:default;}
.trend-tab.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.trend-chart{background:var(--card);border-radius:16px;padding:20px;box-shadow:var(--shadow);}
.trend-title{font-size:12px;color:var(--text-light);margin-bottom:12px;text-align:center;}
.trend-svg{width:100%;overflow:visible;}
.trend-labels{display:flex;justify-content:space-between;padding:0 8px;}
.trend-label{font-size:10px;color:var(--text-light);}
.trend-legend{display:flex;justify-content:center;gap:16px;margin-top:12px;}
.trend-legend span{font-size:11px;color:var(--text-secondary);display:flex;align-items:center;gap:4px;}
.legend-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}

/* ===== Recommendation Cards ===== */
.rec-list{display:flex;flex-direction:column;gap:12px;}
.rec-card{border-radius:14px;padding:16px;position:relative;overflow:hidden;}
.rec-card::after{content:'';position:absolute;top:-15px;right:-15px;width:50px;height:50px;border-radius:50%;opacity:0.08;}
.rec-brown{background:var(--primary-light);border-left:3px solid var(--primary);}
.rec-brown::after{background:var(--primary);}
.rec-green{background:var(--green-light);border-left:3px solid var(--green);}
.rec-green::after{background:var(--green);}
.rec-rose{background:var(--rose-light);border-left:3px solid var(--rose);}
.rec-rose::after{background:var(--rose);}
.rec-blue{background:var(--blue-light);border-left:3px solid var(--blue);}
.rec-blue::after{background:var(--blue);}
.rec-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
.rec-name{font-size:14px;font-weight:600;color:var(--text);}
.rec-price{font-size:13px;font-weight:600;color:var(--primary-dark);}
.rec-reason{font-size:12px;color:var(--text-secondary);line-height:1.6;margin-bottom:8px;}
.rec-effect{font-size:11px;color:var(--text-light);display:flex;align-items:flex-start;gap:4px;}
.rec-effect svg{flex-shrink:0;margin-top:2px;}
.rec-source{display:inline-block;font-size:10px;padding:2px 8px;border-radius:8px;background:rgba(255,255,255,0.6);color:var(--text-light);margin-top:8px;}

/* ===== Next Week ===== */
.focus-list{list-style:none;}
.focus-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;}
.focus-item:not(:last-child){border-bottom:1px dashed var(--border);}
.focus-dot{width:6px;height:6px;border-radius:50%;background:var(--primary);flex-shrink:0;margin-top:7px;}
.focus-text{font-size:13px;color:var(--text);}

/* ===== Knowledge Card ===== */
.knowledge{background:var(--blue-bg);border-radius:14px;padding:16px;margin-top:0;}
.knowledge-title{font-size:12px;color:var(--blue);font-weight:600;margin-bottom:8px;}
.knowledge-text{font-size:12px;color:var(--text-secondary);line-height:1.8;}

/* ===== Footer ===== */
.footer{text-align:center;padding:24px 0 16px;}
.footer-line{width:40px;height:2px;background:var(--primary);margin:0 auto 12px;border-radius:1px;}
.footer-brand{font-size:13px;font-weight:600;color:var(--primary-dark);margin-bottom:4px;}
.footer-slogan{font-size:11px;color:var(--text-light);}
.footer-disclaimer{font-size:10px;color:var(--text-light);margin-top:8px;line-height:1.6;}
</style>
</head>
<body>
<div class="report" id="report"></div>
<script>
// ╔══════════════════════════════════════════════════════╗
// ║  产康师填写区（修改这里的数值即可生成个性化报告）    ║
// ║  每位客户复制一份此文件，修改后导出PDF即可           ║
// ╚══════════════════════════════════════════════════════╝

const CONFIG = {

  // ---- 客户基本信息 ----
  name: "梦梅妈妈",
  roomNumber: "208",              // 房号（可选）
  deliveryDate: "2026-05-20",    // 分娩日期
  deliveryType: "顺产",           // "顺产" / "剖宫产"
  currentWeek: 3,                // 当前周次（1-6）

  // ---- 本周评估数据 ----
  assessment: {
    // 腹直肌（必填）
    diastasisFingers: 3,         // 分离指宽（0-5+，整数或小数）
    diastasisCm: 2.5,            // 分离厘米数
    diastasisType: "脐下型",     // 分型："脐周型"/"脐下型"/"脐上型"/"开放型"

    // 子宫复旧（必填）
    uterusPosition: "未入盆",    // "已入盆" / "未入盆"
    postpartumDays: 21,         // 产后天数

    // 盆底肌力（必填）
    pelvicFloorGrade: 2,         // 肌力等级 0-5（0=无收缩，5=正常）
    pelvicFloorType: "",        // "高张型"/"低张型"/"混合型"（可选）

    // 会阴状态（必填）
    perinealClosure: "未完全闭合", // "已闭合" / "未完全闭合" / "未闭合"
    woundHealing: "良好",        // "良好"/"一般"/"红肿"（可选）

    // 疼痛（可选）
    painLevel: 1,                // 0-5（0=无痛）
    painLocation: "",            // 疼痛部位（可选）
  },

  // ---- 历史评估数据（可选，用于趋势图。留空则无趋势图）
  history: [
    // { week: 1, diastasisFingers: 4.5, pelvicFloorGrade: 1 },
    // { week: 2, diastasisFingers: 3.8, pelvicFloorGrade: 1.5 },
  ],

  // ---- 医生查房建议 ----
  doctorName: "黄医生",
  doctorAdvice: "建议关注盆底肌训练，产后42天内是黄金恢复期。子宫复旧需要加强，建议配合子宫复旧治疗。腹直肌恢复进展良好，继续保持。",

  // ---- 产品推荐 ----
  // 留空数组 [] → 系统根据评估数据自动推荐
  // 手动填写 → 只显示您填写的产品（覆盖系统推荐）
  // 格式：[{ name:"产品名", price:2980, reason:"推荐理由", color:"brown" }]
  recommendations: [
    // 示例：手动推荐
    // { name:"腹部小蛮腰", price:2980, reason:"腹直肌分离3指，建议电刺激+手法修复", color:"brown" },
  ],

  // ---- 本周恢复亮点（可选，留空则自动生成）----
  highlights: [],

  // ---- 下周关注重点（可选，留空则自动生成）----
  nextWeekFocus: [],
};

// ╔══════════════════════════════════════════════════════╗
// ║  以下为系统自动生成区域，无需修改                    ║
// ╚══════════════════════════════════════════════════════╝

// ---- 诊断→产品映射引擎 ----
const PRODUCT_MAP = {
  diastasis_moderate: {
    name: "腹部小蛮腰",
    price: 2980,
    reason: "腹直肌分离{fingers}指，建议电刺激+手法修复，预计2-3周可降至标准值",
    color: "brown",
    effect: "预计2-3周分离宽度降至2指以内",
  },
  diastasis_severe: {
    name: "腹部小蛮腰运动版",
    price: 3980,
    reason: "腹直肌分离{fingers}指，需加强运动康复，排除疝气后启动疗程",
    color: "brown",
    effect: "预计4-6周分离宽度降至2指以内",
  },
  pelvic_electro: {
    name: "盆底肌电刺激",
    price: 1880,
    reason: "盆底肌力{grade}级，42天内是黄金恢复期，建议电刺激训练",
    color: "green",
    effect: "预计10次疗程肌力提升1-2级",
  },
  pelvic_magnetic: {
    name: "盆底肌磁刺激",
    price: 1880,
    reason: "盆底肌力{grade}级，磁刺激可深层激活盆底肌群",
    color: "green",
    effect: "预计8-10次疗程肌力提升1-2级",
  },
  pelvic_manual: {
    name: "盆底肌筋膜手法",
    price: 3160,
    reason: "盆底肌力{grade}级，手法松解+训练可有效改善肌力",
    color: "green",
    effect: "结合电刺激效果更佳",
  },
  perineal_rf: {
    name: "外阴射频修复",
    price: 5980,
    reason: "会阴闭合度不足，射频可促进组织修复与闭合",
    color: "rose",
    effect: "预计5次疗程明显改善闭合度",
  },
  uterus_ultrasound: {
    name: "超声波子宫复旧",
    price: 1876,
    reason: "产后{days}天子宫未入盆，超声波可促进子宫收缩复旧",
    color: "blue",
    effect: "预计5-7次治疗子宫可入盆",
  },
};

// ---- 行业标准值（产后各周）----
const STANDARDS = {
  diastasis: {
    normal: 2,        // 标准值：≤2指
    unit: "指",
    desc: "产后6周内应恢复至2指以内",
    weeklyGoal: [4, 3.5, 3, 2.5, 2, 2],  // 1-6周目标值
  },
  pelvicFloor: {
    normal: 3,        // 标准值：≥Ⅲ级
    unit: "级",
    desc: "产后3个月内应恢复至Ⅲ级以上",
    weeklyGoal: [1, 1.5, 2, 2.5, 3, 3],   // 1-6周目标值
  },
  uterus: {
    normalDays: 14,   // 标准入盆天数
    desc: "顺产14天内、剖宫产21天内应入盆",
  },
};

// ---- 自动推荐逻辑 ----
function autoRecommend(assessment) {
  const recs = [];
  const { diastasisFingers, uterusPosition, pelvicFloorGrade, perinealClosure, postpartumDays } = assessment;

  // 腹直肌
  if (diastasisFingers >= 4) {
    recs.push({ ...PRODUCT_MAP.diastasis_severe, fingers: diastasisFingers });
  } else if (diastasisFingers > 2) {
    recs.push({ ...PRODUCT_MAP.diastasis_moderate, fingers: diastasisFingers });
  }

  // 盆底肌
  if (pelvicFloorGrade < 3) {
    recs.push({ ...PRODUCT_MAP.pelvic_electro, grade: pelvicFloorGrade });
    recs.push({ ...PRODUCT_MAP.pelvic_magnetic, grade: pelvicFloorGrade });
  }

  // 会阴
  if (perinealClosure !== "已闭合") {
    recs.push(PRODUCT_MAP.perineal_rf);
  }

  // 子宫
  if (uterusPosition === "未入盆") {
    recs.push({ ...PRODUCT_MAP.uterus_ultrasound, days: postpartumDays });
  }

  return recs;
}

// ---- 计算恢复指数 ----
function calcScore(assessment) {
  let score = 100;
  const { diastasisFingers, uterusPosition, pelvicFloorGrade, perinealClosure, postpartumDays } = assessment;

  // 腹直肌评分（权重30分）
  if (diastasisFingers <= 2) score -= 0;
  else if (diastasisFingers <= 3) score -= 8;
  else if (diastasisFingers <= 4) score -= 15;
  else score -= 25;

  // 盆底肌评分（权重25分）
  if (pelvicFloorGrade >= 3) score -= 0;
  else if (pelvicFloorGrade >= 2) score -= 10;
  else if (pelvicFloorGrade >= 1) score -= 18;
  else score -= 25;

  // 子宫评分（权重20分）
  if (uterusPosition === "已入盆") score -= 0;
  else if (postpartumDays <= 21) score -= 5;
  else score -= 15;

  // 会阴评分（权重15分）
  if (perinealClosure === "已闭合") score -= 0;
  else if (perinealClosure === "未完全闭合") score -= 5;
  else score -= 15;

  return Math.max(20, Math.min(98, score));
}

// ---- 自动生成亮点 ----
function autoHighlights(assessment, history) {
  const hls = [];
  const { diastasisFingers, uterusPosition, pelvicFloorGrade, perinealClosure } = assessment;

  if (diastasisFingers <= 2) {
    hls.push("腹直肌已恢复至标准范围，非常棒！");
  } else if (history && history.length > 0) {
    const prev = history[history.length - 1];
    if (prev.diastasisFingers && prev.diastasisFingers > diastasisFingers) {
      hls.push("腹直肌从" + prev.diastasisFingers + "指降至" + diastasisFingers + "指，进步明显");
    }
  }
  if (uterusPosition === "已入盆") hls.push("子宫已顺利入盆，复旧良好");
  if (pelvicFloorGrade >= 3) hls.push("盆底肌力达到Ⅲ级，恢复达标");
  if (perinealClosure === "已闭合") hls.push("会阴伤口完全愈合闭合");

  if (hls.length === 0) {
    hls.push("产后恢复按计划进行中，保持良好心态");
  }
  return hls;
}

// ---- 自动生成下周关注 ----
function autoNextWeek(assessment) {
  const focus = [];
  const { diastasisFingers, uterusPosition, pelvicFloorGrade, perinealClosure } = assessment;

  if (diastasisFingers > 2) focus.push("腹直肌修复训练，目标降至" + STANDARDS.diastasis.normal + "指以内");
  if (uterusPosition === "未入盆") focus.push("子宫复旧治疗，促进子宫收缩入盆");
  if (pelvicFloorGrade < 3) focus.push("盆底肌力提升训练，目标达到Ⅲ级");
  if (perinealClosure !== "已闭合") focus.push("会阴闭合观察与修复");
  if (focus.length === 0) focus.push("保持当前恢复节奏，注意休息与营养");

  return focus;
}

// ---- 同龄对比 ----
function compareToPeers(assessment, week, deliveryType) {
  const { diastasisFingers, pelvicFloorGrade } = assessment;
  const stats = [];

  // 腹直肌对比
  const dGoal = STANDARDS.diastasis.weeklyGoal[week - 1] || 2.5;
  if (diastasisFingers <= dGoal) {
    const pct = Math.min(92, 65 + Math.round((dGoal - diastasisFingers) * 15));
    stats.push("腹直肌恢复进度超过" + pct + "%的" + (deliveryType === "剖宫产" ? "剖宫产" : "顺产") + "妈妈");
  } else {
    stats.push("腹直肌恢复处于同龄妈妈的平均水平附近，继续努力");
  }

  // 盆底肌对比
  if (pelvicFloorGrade >= 3) {
    stats.push("盆底肌力表现优异，超过同龄妈妈的78%");
  } else {
    stats.push("盆底肌力正在恢复中，产后3个月内是黄金训练期");
  }

  return stats;
}

// ---- SVG Icons ----
const ICONS = {
  heart: `<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M24 42s-16-10-16-22a10 10 0 0 1 16-8 10 10 0 0 1 16 8c0 12-16 22-16 22z" fill="#C9929B" opacity="0.3" stroke="#C9929B" stroke-width="2.5"/>
  </svg>`,
  abdominal: `<svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M14 4c-2 0-4 2-4 4v2c0 1.5 1 2.5 2 3v4c-2 .5-3 2-3 3.5 0 1 1 2 2 2.5h6c1-.5 2-1.5 2-2.5 0-1.5-1-3-3-3.5v-4c1-.5 2-1.5 2-3V8c0-2-2-4-4-4z" stroke="#A8926E" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <line x1="14" y1="5" x2="14" y2="23" stroke="#A8926E" stroke-width="1" stroke-dasharray="2 2" opacity="0.5"/>
  </svg>`,
  uterus: `<svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">

  </svg>`,
  pelvic: `<svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M6 20c0-5 3-9 8-12 5 3 8 7 8 12" stroke="#8FAF8B" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <circle cx="14" cy="18" r="2" stroke="#8FAF8B" stroke-width="1.5" fill="none"/>
  </svg>`,
  perineum: `<svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M10 6c0 0-2 8 4 14 6-6 4-14 4-14" stroke="#C9929B" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <circle cx="14" cy="20" r="1.5" stroke="#C9929B" stroke-width="1.2" fill="none"/>
  </svg>`,
  stethoscope: `<svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="4" cy="12" r="2" stroke="#fff" stroke-width="1.5" fill="none"/>
    <circle cx="12" cy="12" r="2" stroke="#fff" stroke-width="1.5" fill="none"/>
    <path d="M4 10V6a4 4 0 0 1 8 0v4" stroke="#fff" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </svg>`,
  check: `<svg viewBox="0 0 14 14" fill="none"><path d="M3 7l3 3 5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  progress: `<svg viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M7 4v3l2 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`,
  circle: `<svg viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>`,
  sparkle: `<svg viewBox="0 0 12 12" fill="none"><path d="M6 1l1 4h4l-3 2 1 4-3-3-3 3 1-4-3-2h4z" fill="currentColor" opacity="0.6"/></svg>`,
  arrow: `<svg viewBox="0 0 12 12" fill="none"><path d="M2 6h8M7 3l3 3-3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
};

// ---- 渲染报告 ----
function renderReport(cfg) {
  const score = calcScore(cfg.assessment);
  const recs = cfg.recommendations.length > 0
    ? cfg.recommendations.map(r => ({...r, source: "产康师推荐"}))
    : autoRecommend(cfg.assessment).map(r => ({
        ...r,
        reason: r.reason.replace('{fingers}', cfg.assessment.diastasisFingers)
                        .replace('{grade}', toRoman(cfg.assessment.pelvicFloorGrade))
                        .replace('{days}', cfg.assessment.postpartumDays),
        source: "系统推荐",
      }));
  const hls = cfg.highlights.length > 0 ? cfg.highlights : autoHighlights(cfg.assessment, cfg.history);
  const focus = cfg.nextWeekFocus.length > 0 ? cfg.nextWeekFocus : autoNextWeek(cfg.assessment);
  const peerStats = compareToPeers(cfg.assessment, cfg.currentWeek, cfg.deliveryType);

  // 腹直肌进度百分比
  const dFingers = cfg.assessment.diastasisFingers;
  const dProgress = Math.max(0, Math.min(100, ((5 - dFingers) / 3) * 100));
  // 盆底肌进度百分比
  const pGrade = cfg.assessment.pelvicFloorGrade;
  const pProgress = Math.max(0, Math.min(100, (pGrade / 5) * 100));

  // 里程碑
  const milestones = [];
  milestones.push({
    label: "子宫入盆",
    desc: cfg.assessment.uterusPosition === "已入盆" ? "子宫已顺利入盆" : "子宫尚未入盆，需关注",
    status: cfg.assessment.uterusPosition === "已入盆" ? "done" : "progress",
    tag: cfg.assessment.uterusPosition === "已入盆" ? "已达成" : "进行中",
  });
  milestones.push({
    label: "腹直肌恢复至" + STANDARDS.diastasis.normal + "指以内",
    desc: "当前" + dFingers + "指，目标≤" + STANDARDS.diastasis.normal + "指",
    status: dFingers <= 2 ? "done" : "progress",
    tag: dFingers <= 2 ? "已达成" : "恢复中",
  });
  milestones.push({
    label: "盆底肌力达到Ⅲ级",
    desc: "当前" + toRoman(pGrade) + "级，目标≥Ⅲ级",
    status: pGrade >= 3 ? "done" : "progress",
    tag: pGrade >= 3 ? "已达成" : "恢复中",
  });
  milestones.push({
    label: "会阴完全闭合",
    desc: "当前" + cfg.assessment.perinealClosure,
    status: cfg.assessment.perinealClosure === "已闭合" ? "done" : "todo",
    tag: cfg.assessment.perinealClosure === "已闭合" ? "已达成" : "待恢复",
  });

  // 周次范围
  const weekStart = (cfg.currentWeek - 1) * 7 + 1;
  const weekEnd = cfg.currentWeek * 7;

  // 趋势图数据
  const hasTrend = cfg.history && cfg.history.length > 0;
  const trendWeeks = hasTrend
    ? [...cfg.history.map(h => h.week), cfg.currentWeek]
    : [cfg.currentWeek];
  const trendDiastasis = hasTrend
    ? [...cfg.history.map(h => h.diastasisFingers), cfg.assessment.diastasisFingers]
    : [cfg.assessment.diastasisFingers];
  const trendPelvic = hasTrend
    ? [...cfg.history.map(h => h.pelvicFloorGrade), cfg.assessment.pelvicFloorGrade]
    : [cfg.assessment.pelvicFloorGrade];

  // 生成趋势图SVG
  let trendSvg = '';
  if (hasTrend) {
    const w = 360, h = 120, pad = { t: 20, b: 30, l: 30, r: 20 };
    const cw = w - pad.l - pad.r;
    const ch = h - pad.t - pad.b;
    const n = trendWeeks.length;

    // 腹直肌趋势
    const dMax = 5, dMin = 0;
    const dPoints = trendDiastasis.map((v, i) => {
      const x = pad.l + (i / (n - 1)) * cw;
      const y = pad.t + ((dMax - v) / (dMax - dMin)) * ch;
      return `${x},${y}`;
    }).join(' ');
    const dArea = `${pad.l},${pad.t + ch} ${dPoints} ${pad.l + cw},${pad.t + ch}`;
    // 目标线
    const dTargetY = pad.t + ((dMax - STANDARDS.diastasis.normal) / (dMax - dMin)) * ch;

    // 盆底肌趋势
    const pMax = 5, pMin = 0;
    const pPoints = trendPelvic.map((v, i) => {
      const x = pad.l + (i / (n - 1)) * cw;
      const y = pad.t + ((pMax - v) / (pMax - pMin)) * ch;
      return `${x},${y}`;
    }).join(' ');
    const pArea = `${pad.l},${pad.t + ch} ${pPoints} ${pad.l + cw},${pad.t + ch}`;
    const pTargetY = pad.t + ((pMax - STANDARDS.pelvicFloor.normal) / (pMax - pMin)) * ch;

    trendSvg = `
    <div class="trend-chart">
      <div class="trend-title">恢复趋势</div>
      <svg class="trend-svg" viewBox="0 0 ${w} ${h}">
        <!-- 腹直肌区域 -->
        <polygon points="${dArea}" fill="#C4A882" opacity="0.12"/>
        <polyline points="${dPoints}" fill="none" stroke="#C4A882" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        ${trendDiastasis.map((v, i) => {
          const x = pad.l + (i / (n - 1)) * cw;
          const y = pad.t + ((dMax - v) / (dMax - dMin)) * ch;
          return `<circle cx="${x}" cy="${y}" r="4" fill="#fff" stroke="#C4A882" stroke-width="2"/><text x="${x}" y="${y - 10}" text-anchor="middle" font-size="10" fill="#A8926E" font-weight="600">${v}</text>`;
        }).join('')}
        <!-- 腹直肌目标线 -->
        <line x1="${pad.l}" y1="${dTargetY}" x2="${pad.l + cw}" y2="${dTargetY}" stroke="#C4A882" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>
        <text x="${pad.l + cw}" y="${dTargetY - 4}" text-anchor="end" font-size="9" fill="#A8926E" opacity="0.7">目标≤${STANDARDS.diastasis.normal}指</text>

        <!-- 盆底肌区域 -->
        <polygon points="${pArea}" fill="#8FAF8B" opacity="0.1"/>
        <polyline points="${pPoints}" fill="none" stroke="#8FAF8B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        ${trendPelvic.map((v, i) => {
          const x = pad.l + (i / (n - 1)) * cw;
          const y = pad.t + ((pMax - v) / (pMax - pMin)) * ch;
          return `<circle cx="${x}" cy="${y}" r="4" fill="#fff" stroke="#8FAF8B" stroke-width="2"/><text x="${x}" y="${y + 16}" text-anchor="middle" font-size="10" fill="#6D8E69" font-weight="600">${toRoman(v)}</text>`;
        }).join('')}
        <!-- 盆底肌目标线 -->
        <line x1="${pad.l}" y1="${pTargetY}" x2="${pad.l + cw}" y2="${pTargetY}" stroke="#8FAF8B" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>
        <text x="${pad.l + cw}" y="${pTargetY + 12}" text-anchor="end" font-size="9" fill="#6D8E69" opacity="0.7">目标≥Ⅲ级</text>
      </svg>
      <div class="trend-legend">
        <span><span class="legend-dot" style="background:#C4A882"></span>腹直肌（指宽）</span>
        <span><span class="legend-dot" style="background:#8FAF8B"></span>盆底肌力（等级）</span>
      </div>
      <div class="trend-labels">${trendWeeks.map(w => `<span class="trend-label">第${w}周</span>`).join('')}</div>
    </div>`;
  }

  // 腹直肌状态
  let dStatus, dStatusClass;
  if (dFingers <= 2) { dStatus = "达标"; dStatusClass = "status-good"; }
  else if (dFingers <= 3) { dStatus = "恢复中"; dStatusClass = "status-warn"; }
  else { dStatus = "需加强"; dStatusClass = "status-alert"; }

  // 盆底肌状态
  let pStatus, pStatusClass;
  if (pGrade >= 3) { pStatus = "达标"; pStatusClass = "status-good"; }
  else if (pGrade >= 2) { pStatus = "恢复中"; pStatusClass = "status-warn"; }
  else { pStatus = "需加强"; pStatusClass = "status-alert"; }

  // 子宫状态
  let uStatus, uStatusClass;
  if (cfg.assessment.uterusPosition === "已入盆") { uStatus = "已入盆"; uStatusClass = "status-good"; }
  else { uStatus = "未入盆"; uStatusClass = "status-alert"; }

  // 会阴状态
  let pcStatus, pcStatusClass;
  if (cfg.assessment.perinealClosure === "已闭合") { pcStatus = "已闭合"; pcStatusClass = "status-good"; }
  else if (cfg.assessment.perinealClosure === "未完全闭合") { pcStatus = "部分闭合"; pcStatusClass = "status-warn"; }
  else { pcStatus = "未闭合"; pcStatusClass = "status-alert"; }

  // 推荐卡片颜色循环
  const recColors = ["brown", "green", "rose", "blue", "amber", "brown", "green"];

  return `
  <!-- Header -->
  <div class="header">
    <div class="brand-name">橘米康复中心</div>
    <div class="header-icon">${ICONS.heart}</div>
    <div class="main-title">妈妈恢复周报</div>
    <div class="client-info">
      ${cfg.name}
      <span>·</span>
      ${cfg.deliveryType}
      <span>·</span>
      产后第${cfg.assessment.postpartumDays}天
      ${cfg.roomNumber ? '<span>·</span>' + cfg.roomNumber + '房' : ''}
    </div>
  </div>

  <!-- Week Badge -->
  <div class="week-hero">
    <div class="week-ring-wrap">
      <div class="week-ring">
        <span class="label">第</span>
        <span class="num">${cfg.currentWeek}</span>
        <span class="unit">周</span>
      </div>
    </div>
    <div class="week-range">第${weekStart}天 — 第${weekEnd}天</div>
  </div>

  <!-- Score -->
  <div class="score-card">
    <div class="score-header">
      <div class="score-label">综合恢复指数</div>
      <div class="score-num-wrap">
        <div class="score-num">${score}<small>/100</small></div>
      </div>
    </div>
    <div class="score-bar-wrap">
      <div class="score-bar">
        <div class="score-bar-fill" style="width:${score}%"></div>
      </div>
    </div>
    <div class="score-compare">${peerStats[0]}</div>
  </div>

  <!-- Key Metrics -->
  <div class="metrics" style="margin-bottom:16px;">
    <div class="metric metric-brown">
      <div class="metric-icon">${ICONS.abdominal}</div>
      <div class="metric-name">腹直肌</div>
      <div class="metric-value">${dFingers}<small style="font-size:14px;font-weight:400;color:var(--text-secondary)">指</small></div>
      <div class="metric-status ${dStatusClass}">${ICONS.sparkle} ${dStatus}</div>
      <div class="metric-target">目标：≤${STANDARDS.diastasis.normal}指</div>
    </div>
    <div class="metric metric-blue">
      <div class="metric-icon">${ICONS.uterus}</div>
      <div class="metric-name">子宫复旧</div>
      <div class="metric-value" style="font-size:22px">${uStatus}</div>
      <div class="metric-status ${uStatusClass}">${ICONS.sparkle} ${uStatus === '已入盆' ? '达标' : '需关注'}</div>
      <div class="metric-target">标准：${cfg.deliveryType === '顺产' ? '14' : '21'}天内入盆</div>
    </div>
    <div class="metric metric-green">
      <div class="metric-icon">${ICONS.pelvic}</div>
      <div class="metric-name">盆底肌力</div>
      <div class="metric-value">${toRoman(pGrade)}<small style="font-size:14px;font-weight:400;color:var(--text-secondary)">级</small></div>
      <div class="metric-status ${pStatusClass}">${ICONS.sparkle} ${pStatus}</div>
      <div class="metric-target">目标：≥${toRoman(STANDARDS.pelvicFloor.normal)}级</div>
    </div>
    <div class="metric metric-rose">
      <div class="metric-icon">${ICONS.perineum}</div>
      <div class="metric-name">会阴闭合</div>
      <div class="metric-value" style="font-size:22px">${pcStatus}</div>
      <div class="metric-status ${pcStatusClass}">${ICONS.sparkle} ${pcStatus === '已闭合' ? '达标' : '需关注'}</div>
      <div class="metric-target">目标：完全闭合</div>
    </div>
  </div>

  <!-- Recovery Milestones -->
  <div class="card">
    <div class="section-header">
      <div class="dot dot-amber"></div>
      <div class="section-title">本周恢复里程碑</div>
    </div>
    <ul class="milestone-list">
      ${milestones.map(m => `
      <li class="milestone-item">
        <div class="milestone-icon ${m.status}">
          ${m.status === 'done' ? ICONS.check : m.status === 'progress' ? ICONS.progress : ICONS.circle}
        </div>
        <div class="milestone-text">
          <div class="milestone-label">${m.label}</div>
          <div class="milestone-desc">${m.desc}</div>
        </div>
        <span class="milestone-tag tag-${m.status}">${m.tag}</span>
      </li>`).join('')}
    </ul>
  </div>

  <!-- Highlights -->
  <div class="card" style="background:var(--amber-light);box-shadow:none;border:1px solid #E8DFC8;">
    <div class="section-header">
      <div class="dot dot-amber"></div>
      <div class="section-title">本周恢复亮点</div>
    </div>
    ${hls.map(h => `<div style="font-size:13px;color:var(--text);padding:4px 0;display:flex;align-items:flex-start;gap:8px;">
      <span style="color:var(--amber);flex-shrink:0;margin-top:2px">${ICONS.sparkle}</span>
      <span>${h}</span>
    </div>`).join('')}
  </div>

  <!-- Trend Chart -->
  ${trendSvg ? `<div class="trend-section">${trendSvg}</div>` : ''}

  <!-- Doctor Advice -->
  <div class="doctor-card">
    <div class="doctor-header">
      <div class="doctor-avatar">${ICONS.stethoscope}</div>
      <div>
        <div class="doctor-name">${cfg.doctorName}的建议</div>
        <div class="doctor-role">第${cfg.currentWeek}周查房 · 第${cfg.assessment.postpartumDays}天</div>
      </div>
    </div>
    <div class="doctor-content">${cfg.doctorAdvice}</div>
  </div>

  <!-- Recommendations -->
  ${recs.length > 0 ? `
  <div class="card">
    <div class="section-header">
      <div class="dot dot-brown"></div>
      <div class="section-title">为您定制的产康方案</div>
    </div>
    <div class="rec-list">
      ${recs.map((r, i) => {
        const c = r.color || recColors[i % recColors.length];
        return `
      <div class="rec-card rec-${c}">
        <div class="rec-header">
          <div class="rec-name">${r.name}</div>
          <div class="rec-price">¥${r.price.toLocaleString()}</div>
        </div>
        <div class="rec-reason">${r.reason}</div>
        ${r.effect ? `<div class="rec-effect"><span style="color:var(--${c === 'brown' ? 'primary' : c})">${ICONS.arrow}</span><span>预期效果：${r.effect}</span></div>` : ''}
        ${r.source ? `<div class="rec-source">${r.source}</div>` : ''}
      </div>`;
      }).join('')}
    </div>
  </div>` : ''}

  <!-- Next Week Focus -->
  <div class="card">
    <div class="section-header">
      <div class="dot dot-blue"></div>
      <div class="section-title">下周关注重点</div>
    </div>
    <ul class="focus-list">
      ${focus.map(f => `<li class="focus-item"><div class="focus-dot"></div><div class="focus-text">${f}</div></li>`).join('')}
    </ul>
  </div>

  <!-- Knowledge -->
  <div class="knowledge">
    <div class="knowledge-title">产后恢复小知识</div>
    <div class="knowledge-text">
      ${cfg.currentWeek <= 2 ? "产后前两周是身体修复的基础期，重点在于子宫复旧和伤口愈合。此时不宜进行高强度腹直肌训练，建议以呼吸训练和轻柔活动为主。产后42天内是盆底肌恢复的黄金窗口期，越早开始训练效果越好。" :
        cfg.currentWeek <= 4 ? "产后第3-4周，子宫基本恢复，可以开始逐步加强腹直肌和盆底肌的训练。腹直肌分离在产后6周内恢复效果最佳，建议配合专业仪器的电刺激治疗。同时注意会阴闭合情况，如有异常及时处理。" :
        "产后第5-6周，各项指标应接近或达到标准值。此时可以增加运动强度，如普拉提等核心训练。产后42天复查时，建议做盆底肌电评估和腹直肌复查，根据结果制定后续恢复计划。"}
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div class="footer-line"></div>
    <div class="footer-brand">橘米康复中心</div>
    <div class="footer-slogan">用专业守护每一位妈妈的恢复之旅</div>
    <div class="footer-disclaimer">
      本报告基于本周评估数据生成，仅供参考。<br>
      具体康复方案请遵医嘱，结合个人实际情况制定。
    </div>
  </div>
  `;
}

// ---- 辅助函数 ----
function toRoman(num) {
  const map = ['0', 'Ⅰ', 'Ⅱ', 'Ⅲ', 'Ⅳ', 'Ⅴ'];
  return map[Math.round(num)] || String(num);
}

// ---- 生成页面 ----
document.getElementById('report').innerHTML = renderReport(CONFIG);
</script>
</body>
</html>
