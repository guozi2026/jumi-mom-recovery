<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>橘米 · 妈妈恢复周报编辑器</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&display=swap');

:root {
  --bg: #F5EDE3;
  --editor-bg: #EBE3D7;
  --card: #FDFBF7;
  --warm: #EDE5D8;
  --warm2: #DDD5C8;
  --text: #5C4F3D;
  --text2: #7A6E5B;
  --text3: #A99E8E;
  --pink: #D4A8A2;
  --pink2: #C28F89;
  --green: #8FAF8B;
  --green2: #7A9E76;
  --blue: #8FAAB8;
  --blue2: #7A96A5;
  --lavender: #B8ADC9;
  --amber: #C4A862;
  --rose: #C28F89;
  --paper: #F5EDE3;
  --tape: rgba(196,168,130,0.35);
  --shadow: 0 2px 12px rgba(92,79,61,0.08);
}

*{margin:0;padding:0;box-sizing:border-box;}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: var(--editor-bg);
  color: var(--text);
  line-height: 1.7;
  height: 100vh;
  overflow: hidden;
}

/* ===== 整体布局 ===== */
.app-layout {
  display: flex;
  height: 100vh;
}

/* ===== 左侧编辑面板 ===== */
.editor-panel {
  width: 380px;
  min-width: 380px;
  background: var(--editor-bg);
  border-right: 1px solid var(--warm2);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  height: 100vh;
}

/* 表单导航 */
.form-nav {
  display: flex;
  gap: 6px;
  padding: 10px 16px;
  background: var(--editor-bg);
  border-bottom: 1px solid var(--warm2);
  position: sticky;
  top: 0;
  z-index: 10;
  flex-shrink: 0;
}

.form-nav button {
  padding: 6px 10px;
  border: 1px solid var(--warm2);
  border-radius: 8px;
  background: var(--card);
  font-size: 12px;
  color: var(--text2);
  cursor: pointer;
  font-family: inherit;
  transition: all 0.2s;
  white-space: nowrap;
}

.form-nav button:hover {
  border-color: var(--amber);
  color: var(--amber);
  background: #FFFDF8;
}

/* 表单滚动容器 */
.form-scroll-container {
  flex: 1;
  overflow-y: auto;
  padding: 0 16px 30px;
}

.form-scroll-container::-webkit-scrollbar { width: 6px; }
.form-scroll-container::-webkit-scrollbar-track { background: transparent; }
.form-scroll-container::-webkit-scrollbar-thumb { background: var(--warm2); border-radius: 3px; }

/* 旧编辑器标题区 */
.editor-header-old {
  padding: 16px 0 12px;
  border-bottom: 1px solid var(--warm2);
  margin-bottom: 16px;
}

.editor-title {
  font-size: 17px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 2px;
}

.editor-subtitle {
  font-size: 12px;
  color: var(--text3);
}

.editor-actions {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.editor-actions button {
  flex: 1;
  border: none;
  border-radius: 8px;
  padding: 9px 0;
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
  font-weight: 500;
  transition: all 0.2s;
}

/* 模板选择器 */
/* 快速模板按钮（保留常用） */

.btn-preview {
  background: var(--green2);
  color: #fff;
}
.btn-preview:hover { background: #6B8E68; }

.btn-screenshot {
  background: var(--pink2);
  color: #fff;
}
.btn-screenshot:hover { background: #B07A75; }

.btn-download {
  background: var(--amber);
  color: #fff;
}
.btn-download:hover { background: #C49538; }

.form-section {
  margin-top: 20px;
}

.form-section-title {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text);
  padding-bottom: 6px;
  border-bottom: 1px solid var(--warm2);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.form-section-title .emoji { font-size: 15px; }

.form-row {
  margin-bottom: 10px;
}

/* 紧凑表单行 - 客户信息区使用 */
.form-row.compact {
  margin-bottom: 6px;
}

/* 客户信息网格 - 双列紧凑布局 */
.client-info-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0 10px;
}
/* 网格内所有表单控件统一宽度，防止下拉框被长选项撑宽 */
.client-info-grid .form-input,
.client-info-grid .form-select {
  width: 100%;
  box-sizing: border-box;
}

.form-row.half {
  display: inline-block;
  width: calc(50% - 6px);
  margin-right: 6px;
}

.form-row.half:nth-child(even) {
  margin-right: 0;
  margin-left: 6px;
}

.form-label {
  font-size: 11.5px;
  color: var(--text2);
  margin-bottom: 3px;
  display: block;
}

.form-input, .form-select, .form-textarea {
  width: 100%;
  max-width: 100%;
  border: 1px solid var(--warm2);
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 12.5px;
  color: var(--text);
  background: var(--card);
  font-family: inherit;
  transition: border-color 0.2s, box-shadow 0.2s;
  box-sizing: border-box;
}

.form-input:focus, .form-select:focus, .form-textarea:focus {
  outline: none;
  border-color: var(--amber);
  box-shadow: 0 0 0 3px rgba(196,168,130,0.12);
}

.form-textarea {
  resize: vertical;
  min-height: 50px;
  line-height: 1.5;
}

.form-hint {
  font-size: 11px;
  color: var(--text3);
  margin-top: 3px;
}

/* ===== 右侧预览面板 ===== */
.preview-panel {
  flex: 1;
  background: var(--bg);
  overflow-y: auto;
  display: flex;
  justify-content: center;
  padding: 30px 20px 60px;
}

.preview-panel::-webkit-scrollbar { width: 6px; }
.preview-panel::-webkit-scrollbar-track { background: transparent; }
.preview-panel::-webkit-scrollbar-thumb { background: var(--warm2); border-radius: 3px; }

.letter {
  width: 100%;
  max-width: 420px;
  min-height: 100vh;
  background: var(--bg);
  border-radius: 16px;
  padding: 28px 22px;
}

/* ===== 信件样式（统一字体层级） ===== */
/* 信封顶部 */
.envelope { text-align: center; padding: 20px 0 24px; position: relative; }
.envelope-header {
  display: flex; align-items: center; justify-content: center;
  gap: 10px;
  margin: 0 auto 12px;
}
.envelope-seal {
  width: 36px; height: 36px; border-radius: 50%;
  background: linear-gradient(135deg, var(--pink2), var(--rose));
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 2px 6px rgba(194,143,137,0.25);
}
.envelope-seal svg {
  width: 18px; height: 18px;
}
.envelope-lady {
  width: 36px; height: 36px;
  flex-shrink: 0;
}
.envelope-lady img {
  width: 100%; height: 100%; object-fit: contain;
}
.envelope-brand {
  font-size: 11px; letter-spacing: 5px; color: var(--text2); margin-bottom: 8px; font-weight: 500;
}
.envelope-line {
  width: 56px; height: 2px;
  background: linear-gradient(90deg, transparent, var(--amber), transparent);
  margin: 0 auto 10px;
}
.envelope-date {
  font-size: 12px; color: var(--text3); letter-spacing: 0.5px;
}
.envelope-sub {
  font-size: 11px; color: var(--text3); margin-top: 6px; font-style: italic;
}
/* 出所提醒卡片 */
.checkout-reminder {
  margin: 16px 0;
  background: var(--card);
  border-radius: 14px; padding: 14px 16px;
  border: 1px dashed var(--amber);
  position: relative;
}
.checkout-reminder-icon {
  font-size: 16px; margin-right: 6px;
}
.checkout-reminder-title {
  font-size: 13px; font-weight: 600; color: var(--amber); margin-bottom: 4px;
  display: flex; align-items: center;
}
.checkout-reminder-body {
  font-size: 12px; color: var(--text2); line-height: 1.7;
}

/* 称呼 —— 唯一用装饰字体的地方 */
.salutation { padding: 12px 0 8px; }
.salutation-text {
  font-family: 'ZCOOL XiaoWei', serif;
  font-size: 20px; color: var(--text); letter-spacing: 1px;
}
.salutation-sub {
  font-size: 12px; color: var(--text3); margin-top: 4px;
}

/* 情绪确认卡 —— 信封便签风 */
.affirmation {
  background: #FDF8E8; border-radius: 4px; padding: 18px 16px 14px;
  margin: 20px 0; position: relative;
  transform: rotate(0.5deg);
  box-shadow: 2px 3px 10px rgba(92,79,61,0.10);
}
/* 胶带装饰 */
.affirmation::before {
  content: ''; position: absolute; top: -7px; left: 35%;
  width: 56px; height: 20px;
  background: var(--tape);
  border-radius: 2px;
  transform: rotate(-1deg);
  box-shadow: 0 1px 3px rgba(92,79,61,0.08);
}
/* 信封图标 */
.affirmation::after {
  content: '✉'; position: absolute; top: 8px; right: 12px;
  font-size: 14px; opacity: 0.15; transform: rotate(8deg);
}
.affirmation-text {
  font-size: 14px; color: var(--text); line-height: 2; text-align: left;
  padding-top: 4px; font-family: 'ZCOOL XiaoWei', serif;
}
.affirmation-text .highlight { color: var(--pink2); font-weight: 600; }
.affirmation-sign {
  font-size: 11px; color: var(--text3); text-align: right; margin-top: 8px;
  font-family: 'ZCOOL XiaoWei', serif;
}

/* 段落标签 */
.section { margin: 22px 0 16px; }
.section-tag {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10px; letter-spacing: 1.5px;
  color: var(--text3); background: var(--warm); padding: 3px 10px;
  border-radius: 10px; margin-bottom: 10px;
}
.section-title {
  font-size: 15px; font-weight: 600; color: var(--text);
  margin-bottom: 12px; line-height: 1.5;
  display: flex; align-items: center; gap: 8px;
}
.section-title .hand {
  font-family: 'ZCOOL XiaoWei', serif; font-size: 16px;
}
.section-title .section-emoji {
  font-size: 16px; opacity: 0.7;
}

/* 变化卡片 */
.change-list { display: flex; flex-direction: column; gap: 12px; }
.change-card {
  background: var(--card); border-radius: 14px; padding: 16px 14px;
  position: relative;
  border: 1px solid var(--warm2);
}
.change-sticker { position: absolute; top: 10px; right: 10px; font-size: 16px; opacity: 0.5; }
.change-label { font-size: 11px; color: var(--text3); margin-bottom: 4px; letter-spacing: 0.5px; }
.change-text {
  font-size: 14px; color: var(--text); line-height: 1.7;
}
/* 统一数字样式 —— 不用装饰字体，用weight和color区分 */
.change-text .num {
  font-size: 16px; font-weight: 700; color: var(--pink2);
}
.change-text .num-green { font-size: 16px; font-weight: 700; color: var(--green2); }
.change-text .num-blue { font-size: 16px; font-weight: 700; color: var(--blue2); }
.change-detail { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.6; }
.change-compare { font-size: 11px; color: var(--text3); margin-top: 3px; font-style: italic; }
/* 正常值锚点条 */
.change-anchor {
  margin-top: 6px; padding: 5px 10px;
  background: var(--warm); border-radius: 8px;
  font-size: 11px; color: var(--text2); line-height: 1.6;
  display: flex; align-items: center; gap: 6px;
}
.change-anchor .anchor-standard {
  font-weight: 600; color: var(--green2); white-space: nowrap;
}
.change-anchor .anchor-bar {
  flex: 1; height: 4px; background: var(--warm2); border-radius: 2px;
  position: relative; min-width: 60px;
}
.change-anchor .anchor-fill {
  position: absolute; top: 0; left: 0; height: 100%; border-radius: 2px;
}
.anchor-fill.good { background: var(--green2); }
.anchor-fill.warn { background: var(--amber); }
.anchor-fill.alert { background: var(--pink2); }
.change-anchor .anchor-label { white-space: nowrap; }
/* 趋势指示 */
.trend { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 500; margin-left: 6px; }
.trend-up { color: var(--green2); }
.trend-flat { color: var(--blue2); }
.trend-new { color: var(--text3); }

/* 分隔 */
.divider { text-align: center; padding: 4px 0; }
.divider-dots { font-size: 7px; color: var(--text3); letter-spacing: 5px; }

/* 小知识卡片 */
.knowledge-section { margin: 18px 0; }
.knowledge-title {
  font-size: 13px; font-weight: 600; color: var(--text);
  margin-bottom: 10px; display: flex; align-items: center; gap: 6px;
}
.knowledge-title .section-emoji { font-size: 15px; opacity: 0.7; }
.knowledge-list { display: flex; flex-direction: column; gap: 8px; }
.knowledge-card {
  background: var(--card); border-radius: 12px; padding: 12px 14px;
  position: relative;
  border: 1px solid var(--warm2);
}
.knowledge-card-header {
  display: flex; align-items: center; gap: 6px; margin-bottom: 6px;
}
.knowledge-card-icon {
  width: 24px; height: 24px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; flex-shrink: 0;
}
.knowledge-card-icon.k-pink { background: #FCE4EC; }
.knowledge-card-icon.k-blue { background: #E3F2FD; }
.knowledge-card-icon.k-green { background: #E8F5E9; }
.knowledge-card-icon.k-lavender { background: #F3E5F5; }
.knowledge-card-topic {
  font-size: 12px; font-weight: 600; color: var(--text);
}
.knowledge-card-body {
  font-size: 12px; color: var(--text2); line-height: 1.7;
}
.knowledge-card-body strong {
  color: var(--text); font-weight: 600;
}
.knowledge-card-stats {
  margin-top: 6px; font-size: 11px; color: var(--amber);
  font-weight: 500; font-style: italic;
}

/* 医生卡片 */
.doctor-section { margin: 16px 0; }
.doctor-note {
  background: var(--card);
  border-radius: 14px; padding: 16px 14px;
  border: 1px solid var(--warm2);
}
.doctor-from { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.doctor-avatar {
  width: 32px; height: 32px; border-radius: 50%; background: var(--green);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 12px; font-weight: 600;
}
.doctor-info .d-name { font-size: 13px; font-weight: 600; color: var(--text); }
.doctor-info .d-role { font-size: 11px; color: var(--text3); }
.doctor-info .d-date { font-size: 10px; color: var(--text3); margin-top: 1px; }
.doctor-words { font-size: 13.5px; color: var(--text); line-height: 1.9; }

/* 建议列表 */
.advice-section { margin-top: 14px; }
.advice-header {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 10px; padding-bottom: 8px;
  border-bottom: 1px dashed var(--warm2);
}
.advice-header-icon { font-size: 16px; }
.advice-header-text { font-size: 13px; font-weight: 600; color: var(--text); flex: 1; }
.advice-header-count {
  font-size: 10px; color: #fff; background: var(--pink2);
  padding: 2px 8px; border-radius: 10px;
}
.advice-intro { font-size: 12.5px; color: var(--text2); margin-bottom: 10px; line-height: 1.7; }
.advice-more {
  text-align: center; font-size: 11px; color: var(--text3); padding: 8px;
  cursor: pointer; border-radius: 8px; background: var(--warm);
  transition: background 0.2s;
}
.advice-more:hover { background: var(--warm2); }

/* ===== 排版方式A：横向卡片（默认） ===== */
.advice-list { display: flex; flex-direction: column; gap: 8px; }
.advice-card {
  background: var(--card); border-radius: 12px; padding: 12px;
  position: relative; overflow: hidden;
  border: 1px solid var(--warm2);
  display: flex; align-items: flex-start; gap: 10px;
}
.advice-card::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 2px; }
.advice-card.a-green::after { background: var(--green); }
.advice-card.a-pink::after { background: var(--pink2); }
.advice-card.a-blue::after { background: var(--blue2); }
.advice-card.a-lavender::after { background: var(--lavender); }
.advice-icon {
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; flex-shrink: 0; margin-top: 2px;
}
.advice-icon.i-green { background: #E8F5E9; }
.advice-icon.i-pink { background: #FCE4EC; }
.advice-icon.i-blue { background: #E3F2FD; }
.advice-icon.i-lavender { background: #F3E5F5; }
.advice-body { flex: 1; min-width: 0; }
.advice-why { font-size: 11.5px; color: var(--text2); line-height: 1.5; margin-bottom: 3px; }
.advice-what { font-size: 13.5px; font-weight: 600; color: var(--text); }
.advice-effect { font-size: 11.5px; color: var(--text2); margin-top: 2px; }
.advice-price { font-size: 10.5px; color: var(--text3); margin-top: 4px; }
.advice-source { font-size: 9px; color: var(--text3); background: var(--warm); padding: 1px 5px; border-radius: 4px; display: inline-block; margin-top: 3px; }

/* ===== 排版方式B：竖向便签（紧凑版） ===== */
.letter[data-layout="b"] .advice-list { display: flex; flex-direction: column; gap: 6px; }
.letter[data-layout="b"] .advice-card {
  display: block;
  padding: 10px 12px;
  border-left: 3px solid transparent;
  border-radius: 10px;
}
.letter[data-layout="b"] .advice-card.a-green { border-left-color: var(--green); }
.letter[data-layout="b"] .advice-card.a-pink { border-left-color: var(--pink2); }
.letter[data-layout="b"] .advice-card.a-blue { border-left-color: var(--blue2); }
.letter[data-layout="b"] .advice-card.a-lavender { border-left-color: var(--lavender); }
.letter[data-layout="b"] .advice-card::after { display: none; }
.letter[data-layout="b"] .advice-icon {
  display: inline-flex;
  width: 22px; height: 22px;
  font-size: 11px;
  vertical-align: middle;
  margin: 0 4px 0 0;
}
.letter[data-layout="b"] .advice-body { display: inline; }
.letter[data-layout="b"] .advice-why,
.letter[data-layout="b"] .advice-effect,
.letter[data-layout="b"] .advice-source { display: none; }
.letter[data-layout="b"] .advice-what {
  display: inline;
  font-size: 13px;
  font-weight: 600;
}
.letter[data-layout="b"] .advice-price {
  display: inline;
  font-size: 11px;
  margin-left: 6px;
}
.letter[data-layout="b"] .advice-price::before { content: ' · '; color: var(--text3); font-weight: 400; }

/* ===== 排版方式C：两列网格 ===== */
.letter[data-layout="c"] .advice-list {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.letter[data-layout="c"] .advice-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 14px 10px;
  gap: 6px;
}
.letter[data-layout="c"] .advice-icon {
  width: 40px; height: 40px;
  font-size: 18px;
  margin: 0;
}
.letter[data-layout="c"] .advice-body { width: 100%; }
.letter[data-layout="c"] .advice-why { font-size: 10px; line-height: 1.4; }
.letter[data-layout="c"] .advice-what { font-size: 12px; }
.letter[data-layout="c"] .advice-effect { font-size: 10px; }
.letter[data-layout="c"] .advice-price { font-size: 10px; margin-top: 2px; }
.letter[data-layout="c"] .advice-source { display: none; }

/* 待办事项 */
.todo-section { margin: 16px 0; }
.todo-list { display: flex; flex-direction: column; gap: 0; }
.todo-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 12px 0; border-bottom: 1px dashed var(--warm2);
}
.todo-item:last-child { border-bottom: none; }
.todo-num {
  width: 22px; height: 22px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; color: #fff; flex-shrink: 0; margin-top: 1px;
}
.todo-num.n1 { background: var(--pink2); }
.todo-num.n2 { background: var(--green2); }
.todo-num.n3 { background: var(--blue2); }
.todo-action { font-size: 13.5px; color: var(--text); font-weight: 500; line-height: 1.5; }
.todo-desc { font-size: 12px; color: var(--text2); margin-top: 1px; line-height: 1.5; }

/* 产康师手记 —— 手写便签风格 */
.personal-note-section { margin: 16px 0; }
.personal-note-card {
  background: #FDF8E8;
  border-radius: 4px; padding: 18px 16px 14px;
  border: none;
  position: relative;
  transform: rotate(-1.5deg);
  box-shadow: 2px 3px 10px rgba(92,79,61,0.10);
  font-family: 'ZCOOL XiaoWei', serif;
}
.personal-note-card::before {
  content: ''; position: absolute; top: -6px; left: 30%;
  width: 52px; height: 18px;
  background: var(--tape);
  border-radius: 2px;
  transform: rotate(-2deg);
  box-shadow: 0 1px 3px rgba(92,79,61,0.08);
}
.personal-note-title { font-size: 12.5px; color: var(--amber); margin-bottom: 8px; padding-top: 4px; }

/* 联系卡片 */
.contact-section { margin: 20px 0 0; }
.contact-card {
  background: var(--card); border-radius: 14px; padding: 14px 12px;
  border: 1px solid var(--warm2); position: relative; overflow: hidden;
}
.contact-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2.5px;
  background: linear-gradient(90deg, var(--pink2), var(--green2), var(--blue2));
}
.contact-title { font-size: 12.5px; color: var(--text); font-weight: 600; margin-bottom: 10px; text-align: center; }
.contact-consultant { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.contact-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: linear-gradient(135deg, var(--pink2), var(--rose));
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 14px; font-weight: 600; flex-shrink: 0;
}
.contact-name { font-size: 13px; font-weight: 600; color: var(--text); }
.contact-role { font-size: 11px; color: var(--text3); }
.contact-methods { display: flex; flex-direction: column; gap: 6px; }
.contact-method {
  display: flex; align-items: center; gap: 8px;
  background: var(--warm); border-radius: 8px; padding: 8px 10px;
}
.contact-label { font-size: 10px; color: var(--text3); }
.contact-value { font-size: 12px; color: var(--text); font-weight: 500; }
.contact-hint { font-size: 10.5px; color: var(--text3); text-align: center; margin-top: 8px; font-style: italic; }

/* 信尾 */
.sign-off { margin: 18px 0 6px; text-align: right; padding-right: 4px; }
.sign-words { font-family: 'ZCOOL XiaoWei', serif; font-size: 14px; color: var(--text); line-height: 1.6; }
.sign-brand { font-size: 11px; color: var(--text2); margin-top: 1px; }
.sign-slogan { font-size: 10px; color: var(--text3); margin-top: 0; font-style: italic; }

/* 底部 */
.footer { text-align: left; padding: 10px 0 4px; }
.footer-line { width: 100%; height: 0.5px; background: var(--warm2); margin: 0 0 8px; }
.footer-note { font-size: 10px; color: var(--text3); line-height: 1.7; }
/* 信封个人化TO行 */
.envelope-to {
  font-size: 11px; color: var(--text2); margin-top: 4px;
  letter-spacing: 0.5px; font-weight: 500;
}

/* ===== 截图模式：隐藏编辑面板 ===== */
body.screenshot-mode .editor-panel { display: none; }
body.screenshot-mode .preview-panel {
  padding: 0;
  justify-content: center;
  align-items: flex-start;
  background: var(--bg);
}
body.screenshot-mode .letter {
  max-width: 420px;
  min-height: 100vh;
  border-radius: 0;
  box-shadow: none;
}

/* ===== 悬浮返回按钮（截图/全屏模式可见） ===== */
.back-to-edit-btn {
  display: none;
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 9999;
  background: rgba(92, 79, 61, 0.6);
  color: #FFF;
  border: none;
  border-radius: 20px;
  padding: 8px 16px;
  font-size: 12px;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  transition: all 0.25s;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  opacity: 0.3;
  transform: scale(0.85);
  transform-origin: left center;
}
.back-to-edit-btn:hover {
  background: rgba(92, 79, 61, 0.9);
  opacity: 1;
  transform: scale(1);
  box-shadow: 0 3px 12px rgba(0,0,0,0.2);
}
body.screenshot-mode .back-to-edit-btn {
  display: flex;
  align-items: center;
  gap: 6px;
}
}

/* ===== 移动端适配 ===== */
@media (max-width: 768px) {
  .app-layout { flex-direction: column; }
  .editor-panel {
    width: 100%;
    min-width: 100%;
    height: 50vh;
  }
  .form-scroll-container {
    max-height: 45vh;
  }
  .client-info-grid {
    grid-template-columns: 1fr;
  }
}

/* ===== 推荐方案调整区 ===== */
.rec-summary {

}
.rec-tag {

.rec-tag.auto { background: #E8F5E9; color: var(--green2); }

.rec-add-row {

}
.rec-add-row .form-input { flex: 1; }
.btn-add-rec {

}
.btn-add-rec:hover { background: #B8963D; }
.rec-manual-list { display: flex; flex-direction: column; gap: 4px; }
.rec-manual-item {

  background: #FFF8EE; border: 1px dashed var(--amber);
  border-radius: 8px; padding: 6px 10px; font-size: 12px;
}
.rec-manual-item .rm-name { flex: 1; color: var(--text); font-weight: 500; }
.rec-manual-item .rm-price { color: var(--text3); font-size: 11px; }
.rec-manual-item .rm-del {
  cursor: pointer; color: var(--pink2); font-size: 14px; line-height: 1;
  border: none; background: none; padding: 0 4px;
}
.rec-manual-item .rm-del:hover { color: var(--rose); }

/* 可勾选的自动推荐标签 */
.rec-selectable {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.rec-selectable .rec-tag {
  cursor: pointer;
  user-select: none;
  transition: all 0.15s;
  position: relative;
  padding-left: 22px;
}
.rec-selectable .rec-tag::before {
  content: '✓';
  position: absolute;
  left: 7px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 10px;
  font-weight: 700;
}
.rec-selectable .rec-tag.unchecked {
  background: var(--warm2);
  color: var(--text3);
  opacity: 0.6;
}
.rec-selectable .rec-tag.unchecked::before {
  content: '○';
  font-size: 9px;
  opacity: 0.5;
}
.rec-selectable .rec-tag:hover {

}
.rec-selectable .rec-tag.unchecked:hover {
  opacity: 0.9;
}

/* 排版切换按钮 */
.layout-toggle {

}
.layout-btn {

  color: var(--text2);

/* 手记话术模板 */
.note-templates {

  background: #FFF8F6;
}
.note-tpl-btn:active {
  background: var(--pink2);
  color: #fff;
}

// 读取表单数据
function getFormData() {
  const postpartumDays = parseInt(document.getElementById('inputDays').value) || 1;
  const currentWeek = parseInt(document.getElementById('inputWeek').value) || 1;

  // 计算在所天数
  const checkInDateStr = document.getElementById('inputCheckInDate').value;
  const checkOutDateStr = document.getElementById('inputCheckOutDate').value;
  const today = new Date();
  let stayDays = 0, totalStayDays = 0;
  if (checkInDateStr) {
    const checkIn = new Date(checkInDateStr);
    stayDays = Math.max(1, Math.floor((today - checkIn) / (1000 * 60 * 60 * 24)) + 1);
    if (checkOutDateStr) {
      const checkOut = new Date(checkOutDateStr);
      totalStayDays = Math.max(stayDays, Math.floor((checkOut - checkIn) / (1000 * 60 * 60 * 24)) + 1);
    } else {
      totalStayDays = stayDays;
    }
  }

  // 是否快出所（离所前7天内）
  const nearCheckout = totalStayDays > 0 && stayDays >= totalStayDays - 3;

  // 在所进度百分比
  const stayProgress = totalStayDays > 0 ? Math.min(100, Math.round(stayDays / totalStayDays * 100)) : 0;

  return {
    name: document.getElementById('inputName').value.trim() || '妈妈',
    deliveryType: document.getElementById('inputDelivery').value,
    currentWeek,
    postpartumDays,
    stayDays,
    totalStayDays,
    nearCheckout,
    stayProgress,
    assessment: {
      diastasisUp: parseFloat(document.getElementById('inputDiastasisUp').value) || 0,
      diastasisMid: parseFloat(document.getElementById('inputDiastasisMid').value) || 0,
      diastasisDown: parseFloat(document.getElementById('inputDiastasisDown').value) || 0,

function translateDoctorAdvice(advice) {
  let text = advice;
  text = text.replace(/建议关注/g, '我们可以一起关注');
  text = text.replace(/建议配合/g, '可以试试配合');
  text = text.replace(/建议/g, '可以试试');
  text = text.replace(/需加强/g, '可以再努力一下');
  text = text.replace(/需注意/g, '记得留意一下');
  text = text.replace(/进展良好/g, '恢复得不错呢');

  return text;
}

function autoRecommend(asmt, days, deliveryType) {
  const recs = [];
  const { diastasisMid, uterusPosition, perinealClosure, breastStatus } = asmt;
  const abnormalKeys = []; // 记录哪些维度异常，用于套餐匹配

  // 1. 腹直肌 — 3档
  if (diastasisMid >= 4) {
    recs.push({...PRODUCT_MAP.diastasis_severe, fingers: diastasisMid, _key: 'diastasis'});
    abnormalKeys.push('diastasis');
  } else if (diastasisMid >= 3) {
    recs.push({...PRODUCT_MAP.diastasis_moderate, fingers: diastasisMid, _key: 'diastasis'});
    abnormalKeys.push('diastasis');
  } else if (diastasisMid >= 2.5) {
    recs.push({...PRODUCT_MAP.diastasis_mild, fingers: diastasisMid, _key: 'diastasis'});
    abnormalKeys.push('diastasis');
  }

  // 2. 子宫 — 5种情况（需要产后天数+分娩方式判断）
  const isCesarean = deliveryType === '剖宫产';
  const isOverdue = isCesarean ? days > 21 : days > 14; // 顺产14天/剖宫产21天为入盆参考线

  if (uterusPosition === '未入盆') {
    if (isOverdue) {
      recs.push({...PRODUCT_MAP.uterus_rf, days, _key: 'uterus'});
    } else {
      recs.push({...PRODUCT_MAP.uterus_ultrasound, days, _key: 'uterus'});
    }
    abnormalKeys.push('uterus');
  } else if (uterusPosition === '脐下1指' || uterusPosition === '脐下2指' || uterusPosition === '脐下3指' || uterusPosition === '脐下4指') {
    recs.push({...PRODUCT_MAP.uterus_ultrasound, days, _key: 'uterus'});
    abnormalKeys.push('uterus');
  } else if (uterusPosition === '脐耻之间') {
    recs.push({...PRODUCT_MAP.uterus_rf, days, _key: 'uterus'});
    abnormalKeys.push('uterus');
  } else if (uterusPosition === '伤口上方') {
    recs.push({...PRODUCT_MAP.uterus_breathing, days, _key: 'uterus'});
    abnormalKeys.push('uterus');
    // 剖宫产+伤口上方 → 额外推荐剖宫产专项子宫修复
    if (isCesarean) {
      recs.push({...PRODUCT_MAP.cesarean_uterus, days, _key: 'cesarean_uterus'});
    }
  }
  // 入盆 → 不推荐

  // 3. 会阴 — 2档
  if (perinealClosure === '膨出') {
    recs.push({...PRODUCT_MAP.perineal_inner_rf, _key: 'perineal'});
    abnormalKeys.push('perineal');
  } else if (perinealClosure === '外阴口闭合不全') {
    recs.push({...PRODUCT_MAP.perineal_rf, _key: 'perineal'});
    abnormalKeys.push('perineal');
  }
  // 外阴口闭合 → 不推荐

  // 4. 乳腺
  if (breastStatus === '需要疏通') {
    recs.push({...PRODUCT_MAP.breast_unclog, _key: 'breast'});
    abnormalKeys.push('breast');
  }

  // 5. 组合套餐 — 按异常组合智能匹配
  const hasD = abnormalKeys.includes('diastasis');
  const hasU = abnormalKeys.includes('uterus');
  const hasP = abnormalKeys.includes('perineal');
  const hasB = abnormalKeys.includes('breast');

  // 安心卡（含乳腺）：腹直肌+子宫+乳腺
  if (hasD && hasU && hasB) {
    recs.push({...PRODUCT_MAP.package_安心卡乳腺, _key: 'package_安心卡乳腺'});
  }
  // 安心卡：腹直肌+子宫+盆底肌（这里盆底肌=会阴异常，作为盆底肌的代理指标）
  else if (hasD && hasU && hasP) {
    recs.push({...PRODUCT_MAP.package_安心卡, _key: 'package_安心卡'});
  }
  // 生殖套餐2：腹直肌+盆底肌（会阴异常视为盆底肌相关）
  else if (hasD && hasP) {
    recs.push({...PRODUCT_MAP.package_repro2, _key: 'package_repro2'});
  }
  // 生殖套餐1：腹直肌+子宫
  else if (hasD && hasU) {
    recs.push({...PRODUCT_MAP.package_repro1, _key: 'package_repro1'});
  }

  return recs.map(r => ({
    ...r,
    why: r.why ? r.why.replace('{fingers}', r.fingers || '').replace('{days}', days) : '',
    source: '系统推荐',
  }));
}

// 日期自动计算：产后天数、在所天数、周次
function calcDaysFromDate() {
  const birthDateStr = document.getElementById('inputBirthDate').value;
  const checkInDateStr = document.getElementById('inputCheckInDate').value;
  const checkOutDateStr = document.getElementById('inputCheckOutDate').value;

  const today = new Date();

  // 产后天数
  let postpartumDays = 1, currentWeek = 1;
  if (birthDateStr) {
    const birthDate = new Date(birthDateStr);
    postpartumDays = Math.max(1, Math.floor((today - birthDate) / (1000 * 60 * 60 * 24)));
    currentWeek = Math.min(6, Math.max(1, Math.ceil(postpartumDays / 7)));
  }
  document.getElementById('inputDays').value = postpartumDays;
  document.getElementById('inputWeek').value = currentWeek;

  // 在所天数
  let stayDays = 0, totalStayDays = 0;
  if (checkInDateStr) {
    const checkIn = new Date(checkInDateStr);
    stayDays = Math.max(1, Math.floor((today - checkIn) / (1000 * 60 * 60 * 24)) + 1);
    if (checkOutDateStr) {
      const checkOut = new Date(checkOutDateStr);
      totalStayDays = Math.max(stayDays, Math.floor((checkOut - checkIn) / (1000 * 60 * 60 * 24)) + 1);
    }
  }

  // 套餐天数提示
  const stayHint = document.getElementById('stayHint');
  if (totalStayDays > 0) {
    const pkgName = totalStayDays <= 28 ? '28天套餐' : totalStayDays <= 30 ? '30天套餐' : totalStayDays <= 42 ? '42天套餐' : `${totalStayDays}天`;
    stayHint.textContent = pkgName;
  }

  // 日期计算提示
  const dateCalcHint = document.getElementById('dateCalcHint');
  let hint = `产后第${postpartumDays}天 · 第${currentWeek}周`;
  if (stayDays > 0 && totalStayDays > 0) {
    hint = `产后第${postpartumDays}天 · 在所第${stayDays}天 / 共${totalStayDays}天`;
  } else if (stayDays > 0) {
    hint = `产后第${postpartumDays}天 · 在所第${stayDays}天`;
  }
  dateCalcHint.textContent = hint;

  markModified();
  updateRecSummary();
  renderLetter();
}

  clear: () => '',
};

function setNoteTpl(type) {
  const name = document.getElementById('inputName').value.trim() || '梦梅';
  const tpl = NOTE_TEMPLATES[type];
  if (tpl) {
    document.getElementById('inputPersonalNote').value = tpl(name);
    markModified();
    renderLetter();
  }
}

function updateRecSummary() {
  const cfg = getFormData();
  const autoRecs = autoRecommend(cfg.assessment, cfg.postpartumDays, cfg.deliveryType);
  const summary = document.getElementById('recSummary');
  const manualList = document.getElementById('recManualList');

  // 自动推荐摘要（可勾选）
  let tags = autoRecs.map((r, idx) => {
    const isDisabled = disabledAutoRecs.has(r._key);
    return `<span class="rec-tag auto ${isDisabled ? 'unchecked' : ''}" onclick="toggleAutoRec('${r._key}')" title="点击${isDisabled ? '启用' : '取消'}该项目">${r.what}</span>`;
  }).join('');
  tags += manualRecs.map(r => `<span class="rec-tag manual">${r.name}</span>`).join('');
  summary.innerHTML = tags || '<span class="rec-tag">暂无推荐</span>';

  // 手动推荐列表
  manualList.innerHTML = manualRecs.map((r, i) => `
    <div class="rec-manual-item">
      <span class="rm-name">${r.name}</span>
      <span class="rm-price">${r.price ? '¥' + r.price.toLocaleString() : ''}</span>
      <button class="rm-del" onclick="removeManualRec(${i})">×</button>
    </div>
  `).join('');
}

function toggleAutoRec(key) {
  if (disabledAutoRecs.has(key)) {
    disabledAutoRecs.delete(key);
  } else {
    disabledAutoRecs.add(key);
  }
  markModified();
  updateRecSummary();
  renderLetter();
}

// 保存产康师和医生信息到localStorage
function saveDefaults() {
  localStorage.setItem('jumi_doctorName', document.getElementById('inputDoctorName').value);
  localStorage.setItem('jumi_doctorTitle', document.getElementById('inputDoctorTitle').value);
  localStorage.setItem('jumi_consultantName', document.getElementById('inputConsultantName').value);
  localStorage.setItem('jumi_consultantPhone', document.getElementById('inputConsultantPhone').value);
  localStorage.setItem('jumi_consultantWechat', document.getElementById('inputConsultantWechat').value);
  localStorage.setItem('jumi_consultantHours', document.getElementById('inputConsultantHours').value);
}

function setLetterLayout(layout) {
  currentLetterLayout = layout;
  document.querySelectorAll('.layout-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.layout === layout);
  });
  const letter = document.getElementById('letter');
  if (letter) letter.setAttribute('data-layout', layout);
  renderLetter();
}

function renderLetter() {
  const cfg = getFormData();
  const asmt = cfg.assessment;
  const last = cfg.lastWeek;
  const changes = describeChanges(asmt, last, cfg);
  
  // 情绪确认语：基于在所进度选择，而非硬绑定周数
  let affIdx;
  if (cfg.stayProgress <= 20) affIdx = 0;
  else if (cfg.stayProgress <= 40) affIdx = 1;
  else if (cfg.stayProgress <= 60) affIdx = 2;
  else if (cfg.stayProgress <= 80) affIdx = 3;
  else if (cfg.stayProgress < 100) affIdx = 4;
  else affIdx = 5;
  const aff = AFFIRMATIONS[affIdx] || AFFIRMATIONS[2];

  const docAdvice = translateDoctorAdvice(cfg.doctorAdvice);
  const allAutoRecs = autoRecommend(asmt, cfg.postpartumDays, cfg.deliveryType);
  // 快出所时额外推荐盆底肌
  const nearCheckout = cfg.totalStayDays > 0 && cfg.stayDays >= cfg.totalStayDays - 3;
  const checkoutRec = nearCheckout ? [{...PRODUCT_MAP.checkout_pelvic, _key: 'checkout_pelvic', why: PRODUCT_MAP.checkout_pelvic.why, source: '系统推荐'}] : [];
  const recs = [...allAutoRecs.filter(r => !disabledAutoRecs.has(r._key)), ...checkoutRec.filter(r => !disabledAutoRecs.has(r._key)), ...manualRecs];
  const todos = autoTodos(asmt);
  const knowledgeItems = getKnowledgeItems(asmt);
  const c = cfg.consultant;

  // 双时间线文案
  const postpartumText = `产后第${cfg.postpartumDays}天 · 第${cfg.currentWeek}周`;
  const stayText = '陪你慢慢恢复 ✦';

  // 医生查房日期文案
  let doctorRoleText = '';
  if (cfg.doctorTitle) doctorRoleText = cfg.doctorTitle;
  let doctorDateText = '';
  if (cfg.doctorDate) {
    const dd = new Date(cfg.doctorDate);
    doctorDateText = `${dd.getMonth()+1}月${dd.getDate()}日查房`;
  } else {
    doctorDateText = `产后第${cfg.postpartumDays}天查房`;
  }

  let html = `
  <div class="letter-inner" data-layout="${currentLetterLayout}">
  <div class="envelope">
    <div class="envelope-header">
      <div class="envelope-seal">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z" fill="#fff" opacity="0.9"/>
        </svg>
      </div>
      <div class="envelope-lady">
        <img src="lady-curve-dark.jpg" alt="女士曲线">
      </div>
    </div>
    <div class="envelope-brand">橘 米 康 复 中 心</div>
    <div class="envelope-line"></div>
    <div class="envelope-date">${postpartumText}</div>
    <div class="envelope-to">TO：${cfg.name}妈妈 · 第${cfg.currentWeek}周周报</div>
    <div class="envelope-sub">${stayText}</div>
  </div>

  ${cfg.nearCheckout ? `
  <div class="checkout-reminder">
    <div class="checkout-reminder-title">
      <span class="checkout-reminder-icon">🏠</span>
      走之前，我们还能一起做这些
    </div>
    <div class="checkout-reminder-body">
      ${cfg.name}妈妈，${cfg.totalStayDays - cfg.stayDays === 0 ? '今天就要回家了！' : `还有${cfg.totalStayDays - cfg.stayDays}天就要回家了！`}回家前记得：做一次全面评估、确认出院康复方案、带上在家也能做的训练计划。回家不是结束，是新的开始~
    </div>
  </div>` : ''}

  <div class="salutation">
    <div class="salutation-text">亲爱的${cfg.name}妈妈：</div>
    <div class="salutation-sub">展信安 ✿ 这是你在橘米的第${cfg.stayDays || cfg.postpartumDays}天${cfg.totalStayDays > 0 ? `，还有${cfg.totalStayDays - cfg.stayDays}天就要回家啦` : ''}</div>
  </div>

  <div class="section">
    <div class="section-tag">WEEK ${cfg.currentWeek} · 产后第${cfg.postpartumDays}天</div>
    <div class="section-title"><span class="section-emoji">🌿</span><span class="hand">这周，你的身体悄悄发生了这些变化</span></div>
    <div class="change-list">
      ${changes.map(c => `
      <div class="change-card ${c.color}">
        <div class="change-sticker">${c.sticker}</div>
        <div class="change-label">${c.label}</div>
        <div class="change-text">${c.text}</div>
        <div class="change-detail">${c.detail}</div>

  <div class="affirmation">
    <div class="affirmation-text">${aff.text.replace('{name}', cfg.name)}</div>

  ${knowledgeItems.length > 0 ? `

    <div class="knowledge-title"><span class="section-emoji">💡</span><span class="hand">你关心的小知识</span></div>

  <div class="doctor-section">

      <div class="doctor-from">

          <div class="d-name">${cfg.doctorName}${doctorRoleText ? ` · ${doctorRoleText}` : ''}</div>

  <div class="divider"><div class="divider-dots">· · ·</div></div>

  <div class="todo-section">

    <div class="todo-list">
      ${todos.map((t, i) => `

        </div>

    </div>
  </div>

  ${recs.length > 0 ? `

  <div class="advice-section">
    <div class="advice-header">
      <span class="advice-header-icon">🌿</span>
      <span class="advice-header-text">根据你的情况，这些项目可能会帮到你</span>
      ${recs.length > 2 ? `<span class="advice-header-count">${recs.length}项</span>` : ''}
    </div>
    <div class="advice-intro">以下是我们根据这周评估数据整理的，供你参考选择~</div>
    <div class="advice-list">
      ${recs.map(r => `
      <div class="advice-card ${r.color}">
        <div class="advice-icon i-${r.color.replace('a-', '')}">${r.color === 'a-green' ? '🌿' : r.color === 'a-pink' ? '🎀' : r.color === 'a-blue' ? '💧' : '🌸'}</div>

  // 产康师手记
  if (cfg.personalNote) {
    html += `
    <div class="personal-note-section">
      <div class="personal-note-card">
        <div class="personal-note-title">💌 ${c.name || '产康师'}写给你的</div>
        <div class="personal-note-body">${cfg.personalNote}</div>

  }

  // 联系顾问
  if (c.name) {
    html += `
    <div class="contact-section">
      <div class="contact-card">
        <div class="contact-title">想约训练或了解方案？找我聊聊 🌿</div>

        <div class="contact-hint">想约训练、了解恢复方案，随时跟我说～</div>

  html += `

    </div>

  </div><!-- /.letter-inner -->

  document.getElementById('letter').innerHTML = html;

// 一键截图下载
async function downloadScreenshot() {
  const letter = document.querySelector('.letter');
  if (!letter) return alert('请先生成周报');
  
  // 显示加载提示
  const btn = document.querySelector('.btn-download');
  const origText = btn.textContent;
  btn.textContent = '⏳ 生成中...';
  btn.disabled = true;
  
  try {
    // 先进入截图模式确保干净画面
    const wasScreenshot = document.body.classList.contains('screenshot-mode');
    if (!wasScreenshot) document.body.classList.add('screenshot-mode');
    
    // 等待一帧让样式生效
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    
    const canvas = await html2canvas(letter, {
      scale: 2, // 2x高清
      useCORS: true,
      backgroundColor: null,
      logging: false,
      // 精确裁剪信件内容
      width: letter.scrollWidth,
      height: letter.scrollHeight,
    });
    
    // 恢复模式
    if (!wasScreenshot) document.body.classList.remove('screenshot-mode');
    
    // 生成文件名
    const nameInput = document.getElementById('inputName');
    const name = nameInput ? nameInput.value || '妈妈' : '妈妈';
    const date = new Date().toLocaleDateString('zh-CN', {month:'numeric', day:'numeric'});
    const filename = `橘米周报_${name}_${date}.png`;
    
    // 触发下载
    const link = document.createElement('a');
    link.download = filename;
    link.href = canvas.toDataURL('image/png');
    link.click();
    
    btn.textContent = '✅ 已保存';
    setTimeout(() => { btn.textContent = origText; }, 2000);
  } catch (err) {
    console.error('截图失败:', err);
    alert('截图生成失败，请尝试手动截图（按PrintScreen或Win+Shift+S）');
    btn.textContent = origText;
  }
  btn.disabled = false;
}
